.modal-backdrop{position:fixed;inset:0;background:#26180f78;backdrop-filter:blur(5px);z-index:50;display:none;align-items:center;justify-content:center;padding:15px}.modal-backdrop.show{display:flex;animation:fade .2s}.modal{width:min(650px,100%);max-height:92vh;overflow:auto;background:var(--paper);border-radius:24px;padding:22px;box-shadow:0 25px 80px #24160f55;animation:pop .24s ease}@keyframes pop{from{opacity:0;transform:translateY(15px) scale(.98)}to{opacity:1;transform:none}}.modal.wide{width:min(1100px,100%)}.modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:18px}.modal-head h2{margin:0;color:var(--deep);font-size:21px}.modal-head p{margin:5px 0 0;color:var(--muted);font-size:12px}.close{width:35px;height:35px;border:0;border-radius:11px;background:#efe2d6;color:var(--deep);font-size:20px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.form-field{display:grid;gap:6px}.form-field.full{grid-column:1/-1}.form-field label{font-size:12px;font-weight:900;color:#765a48}.form-field input,.form-field select,.form-field textarea{width:100%;border:1px solid #e5d6c8;border-radius:12px;padding:11px 12px;background:#fffdf9;color:var(--ink);outline:none}.form-field textarea{min-height:85px;resize:vertical}.form-field input:focus,.form-field select:focus,.form-field textarea:focus{border-color:var(--cocoa);box-shadow:0 0 0 3px #79513d15}.modal-actions{display:flex;justify-content:flex-start;gap:9px;margin-top:18px}

.mobile-nav{display:none}.footer-note{text-align:center;color:#a08b7c;font-size:10px;margin-top:22px}

@media(max-width:760px){.topbar{height:65px;padding:0 13px}.brand-name{font-size:21px}.brand-tag,.profile>div:last-child,.search{display:none}.top-actions{gap:7px}.shell{display:block;padding:16px 12px 90px}.sidebar{display:none}.page-head{align-items:flex-start;flex-direction:column}.page-head h1{font-size:25px}.hero{grid-template-columns:1fr;padding:22px}.hero h2{font-size:24px}.hero-art{display:none}.stats{gap:9px}.stat{padding:13px}.stat strong{font-size:21px}.grid-two{grid-template-columns:1fr}.cards{grid-template-columns:1fr}.quick-grid{grid-template-columns:repeat(2,1fr)}.mobile-nav{position:fixed;bottom:0;right:0;left:0;z-index:30;display:flex;justify-content:space-around;gap:3px;padding:8px 5px calc(8px + env(safe-area-inset-bottom));background:#fffaf2f5;border-top:1px solid var(--line);backdrop-filter:blur(16px)}.mobile-nav button{border:0;background:transparent;color:var(--muted);font-size:10px;display:grid;gap:3px;justify-items:center;min-width:48px}.mobile-nav button span{font-size:18px}.mobile-nav button.active{color:var(--deep);font-weight:900}.board-layout{grid-template-columns:1fr}.board-wrap canvas{height:360px}.board-side{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.board-side h4,.board-side p{grid-column:1/-1}.form-grid{grid-template-columns:1fr}.form-field.full{grid-column:auto}.modal{padding:17px}.modal.wide{width:100%}.toolbar{align-items:stretch}.field-search{min-width:100%}.filter{flex:1}.page-head .btn{width:100%}}

<body>
<div class="app">
<header class="topbar">
 <div class="brand"><div class="brand-mark">م</div><div><div class="brand-name">مِداد</div><div class="brand-tag">مساحة الأستاذ لصناعة التعلّم</div></div></div>
 <div class="top-actions">

  <div class="profile"><div class="avatar" id="avatar">أ</div><div><b id="teacherName">الأستاذ</b><small>مساحة العمل الشخصية</small></div></div>
 </div>
</header>
<div class="shell">
<aside class="sidebar">
 <div class="side-heading"><b>مساحة العمل</b><p>كل أدواتك التعليمية في مكان واحد. أنشئ، نظّم، واحتفظ بمواردك.</p></div>
 <div class="nav-label">الرئيسية</div><nav class="nav">
  <button class="active" data-page="home" onclick="navigate('home')"><span class="ni">⌂</span>لوحة التحكم</button>
 </nav>
 <div class="nav-label">إدارة القسم</div><nav class="nav">
  <button data-page="classes" onclick="navigate('classes')"><span class="ni">▦</span>الأقسام</button>
  <button data-page="students" onclick="navigate('students')"><span class="ni">♙</span>التلاميذ</button>
  <button data-page="attendance" onclick="navigate('attendance')"><span class="ni">✓</span>الحضور والغياب</button>
 </nav>
 <div class="nav-label">صناعة المحتوى</div><nav class="nav">
  <button data-page="lessons" onclick="navigate('lessons')"><span class="ni">▤</span>الدروس والتحضير</button>
  <button data-page="activities" onclick="navigate('activities')"><span class="ni">◇</span>الأنشطة التفاعلية</button>
  <button data-page="assessments" onclick="navigate('assessments')"><span class="ni">▧</span>التقويم والاختبارات</button>
  <button data-page="library" onclick="navigate('library')"><span class="ni">▣</span>مكتبة الموارد</button>

  <button data-page="reports" onclick="navigate('reports')"><span class="ni">▥</span>التقارير</button>

 </nav>
 <div class="side-bottom">مِداد — إصدار الأستاذ<br>بياناتك محفوظة على هذا الجهاز.</div>

<main id="main"></main>
</div>

 <button class="active" data-page="home" onclick="navigate('home')"><span>⌂</span>الرئيسية</button>

 <button data-page="lessons" onclick="navigate('lessons')"><span>▤</span>الدروس</button>
 <button data-page="students" onclick="navigate('students')"><span>♙</span>التلاميذ</button>

</nav>
</div>
<div class="modal-backdrop" id="modalBackdrop" onclick="if(event.target===this)closeModal()"><section class="modal" id="modal"></section></div>
<div class="toast" id="toast"></div>
<script>
const KEY='midad_workspace_v3';
const defaults={teacher:'الأستاذ',school:'',year:'2026 / 2027',classes:[],students:[],lessons:[],activities:[],assessments:[],attendance:[],resources:[]};
let db=load(),page='home',board=null,boardCtx=null,boardDrawing=false,boardTool='pen',boardColor='#563829',boardSize=4,boardHistory=[];
function load(){try{return Object.assign({},defaults,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){return {...defaults}}}
function save(){localStorage.setItem(KEY,JSON.stringify(db));}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(s){let t=document.getElementById('toast');t.textContent=s;t.classList.add('show');clearTimeout(window._toast);window._toast=setTimeout(()=>t.classList.remove('show'),2600)}
function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function dateNow(){return new Date().toISOString().slice(0,10)}
function dateLabel(d){if(!d)return '—';try{return new Date(d+'T12:00:00').toLocaleDateString('ar-DZ',{year:'numeric',month:'short',day:'numeric'})}catch(e){return d}}
function count(arr){return arr.length.toLocaleString('ar-DZ')}
function pageHead(kicker,title,desc,action){return '<div class="page-head"><div><div class="eyebrow">'+kicker+'</div><h1>'+title+'</h1><p>'+desc+'</p></div>'+(action||'')+'</div>'}
function empty(title,desc,button){return '<div class="empty"><strong>'+title+'</strong><span>'+desc+'</span>'+(button?'<div style="margin-top:14px">'+button+'</div>':'')+'</div>'}
function btn(label,fn,kind='primary',icon=''){return '<button class="btn '+kind+'" onclick="'+fn+'">'+(icon?icon+' ':'')+label+'</button>'}
function navigate(p){page=p;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render();window.scrollTo({top:0,behavior:'smooth'})}
function render(){let m=document.getElementById('main');let views={home:homePage,classes:classesPage,students:studentsPage,attendance:attendancePage,lessons:lessonsPage,activities:activitiesPage,assessments:assessmentsPage,library:libraryPage,reports:reportsPage,settings:settingsPage};m.innerHTML=(views[page]||homePage)();document.getElementById('teacherName').textContent=db.teacher||'الأستاذ';document.getElementById('avatar').textContent=(db.teacher||'أ').trim().charAt(0);if(page==='attendance')fillAttendanceClass()}
function homePage(){let today=db.attendance.filter(x=>x.date===dateNow());let recent=db.lessons.slice().sort((a,b)=>(b.created||'').localeCompare(a.created||'')).slice(0,4);return pageHead('مساحة العمل','مرحباً، '+esc(db.teacher||'أستاذنا')+'','ابدأ يومك بتنظيم القسم وصناعة تجربة تعلم أكثر فاعلية.',btn('＋ تحضير درس',"openLesson()"))+
'<section class="hero"><div class="hero-copy"><div class="hero-kicker">مِداد — أدواتك، أفكارك، وأثرُك</div><h2>حوّل أفكارك التعليمية<br>إلى موارد جاهزة للتعلّم.</h2><p>خطّط دروسك، أنشئ أنشطة، تابع تلاميذك، واجمع أعمالك في مساحة واحدة مرتبة.</p><div class="hero-actions">'+btn('إنشاء قسم',"openClass()")+' '+btn('إضافة تلميذ',"openStudent()",'secondary')+'</div></div><div class="hero-art"><div class="paper-stack"><span></span><span></span><span>مِداد</span></div></div></section>'+
'<section class="stats"><div class="stat"><div class="stat-icon">▦</div><div><strong>'+count(db.classes)+'</strong><small>الأقسام المسجلة</small></div></div><div class="stat"><div class="stat-icon">♙</div><div><strong>'+count(db.students)+'</strong><small>التلاميذ</small></div></div><div class="stat"><div class="stat-icon">▤</div><div><strong>'+count(db.lessons)+'</strong><small>الدروس المحضّرة</small></div></div><div class="stat"><div class="stat-icon">✓</div><div><strong>'+count(today)+'</strong><small>سجلات حضور اليوم</small></div></div></section>'+
'<section class="grid-two"><div class="card"><div class="section-title"><div><h3>ابدأ عملاً جديداً</h3><p>اختصارات لأكثر المهام استخداماً</p></div></div><div class="quick-grid"><button class="quick" onclick="openLesson()"><div class="qico">▤</div><b>تحضير درس</b><small>اكتب الأهداف والشرح وارسم</small></button><button class="quick" onclick="openActivity()"><div class="qico">◇</div><b>نشاط تفاعلي</b><small>أنشئ نشاطاً للمراجعة</small></button><button class="quick" onclick="openAssessment()"><div class="qico">▧</div><b>تقويم قصير</b><small>جهّز أسئلة التقييم</small></button><button class="quick" onclick="navigate(\'attendance\')"><div class="qico">✓</div><b>تسجيل الحضور</b><small>تابع حضور تلاميذك</small></button></div></div><div class="card"><div class="section-title"><div><h3>آخر الدروس</h3><p>أحدث ما أضفته إلى مكتبتك</p></div><button class="text-link" onclick="navigate(\'lessons\')">عرض الكل ←</button></div>'+(recent.length?'<div class="list">'+recent.map(x=>'<div class="list-row"><div class="list-main"><div class="mini-icon">▤</div><div><b>'+esc(x.title)+'</b><small>'+esc(x.subject||'دون مادة')+' · '+dateLabel(x.created)+'</small></div></div><button class="text-link" onclick="viewLesson(\''+x.id+'\')">فتح</button></div>').join('')+'</div>':empty('لم تحضّر أي درس بعد','ابدأ بإنشاء أول درس ليظهر هنا.',btn('تحضير أول درس',"openLesson()",'secondary')) )+'</div></section><div class="footer-note">مِداد — مساحة عمل تعليمية مستقلة</div>'}
function classesPage(){return pageHead('إدارة القسم','الأقسام التعليمية','أنشئ أقسامك ونظّم قوائم التلاميذ حسب المستوى.',btn('＋ إنشاء قسم',"openClass()"))+'<div class="toolbar"><input class="field-search" id="classFilter" placeholder="ابحث عن قسم..." oninput="filterCards(\'classCards\',this.value)"></div><div class="cards" id="classCards">'+(db.classes.length?db.classes.map(c=>'<article class="item-card" data-search="'+esc((c.name+' '+c.level+' '+c.year).toLowerCase())+'"><div class="item-top"><div class="item-symbol">▦</div><span class="pill">'+esc(c.level||'قسم')+'</span></div><h3>'+esc(c.name)+'</h3><p>'+esc(c.year||db.year)+' · '+esc(c.stage||'')+'</p><div class="item-meta"><span class="pill green">'+count(db.students.filter(s=>s.classId===c.id))+' تلميذ</span><span class="pill">'+esc(c.capacity||'—')+' مقعد متوقع</span></div><div class="item-actions">'+btn('قائمة التلاميذ',"classStudents('"+c.id+"')",'light small')+btn('تعديل',"editClass('"+c.id+"')",'secondary small')+btn('حذف',"deleteItem('classes','"+c.id+"')",'danger small')+'</div></article>').join(''):empty('لا توجد أقسام بعد','أنشئ قسماً لتبدأ في تسجيل التلاميذ وتنظيم الدروس.',btn('إنشاء أول قسم',"openClass()")) )+'</div>'}
function studentsPage(){return pageHead('إدارة القسم','التلاميذ','سجّل بيانات التلاميذ واربط كل تلميذ بقسمه.',btn('＋ إضافة تلميذ',"openStudent()"))+'<div class="toolbar"><input class="field-search" id="studentFilter" placeholder="ابحث بالاسم..." oninput="filterRows(this.value)"><select class="filter" id="studentClassFilter" onchange="filterRows(document.getElementById(\'studentFilter\').value)"><option value="">كل الأقسام</option>'+db.classes.map(c=>'<option value="'+c.id+'">'+esc(c.name)+'</option>').join('')+'</select></div><div class="table-wrap"><table><thead><tr><th>التلميذ</th><th>القسم</th><th>رقم/معرّف</th><th>ملاحظات</th><th>إجراء</th></tr></thead><tbody id="studentRows">'+(db.students.length?db.students.map(s=>studentRow(s)).join(''):'<tr><td colspan="5">'+empty('لا يوجد تلاميذ مسجلون','أضف التلاميذ يدوياً أو أنشئ قسماً أولاً.',btn('إضافة تلميذ',"openStudent()",'secondary'))+'</td></tr>')+'</tbody></table></div>'}
function studentRow(s){let c=db.classes.find(x=>x.id===s.classId);return '<tr data-search="'+esc((s.name+' '+(c?c.name:'')+' '+s.number).toLowerCase())+'" data-class="'+esc(s.classId||'')+'"><td class="student-name">'+esc(s.name)+'</td><td>'+esc(c?c.name:'غير محدد')+'</td><td>'+esc(s.number||'—')+'</td><td>'+esc(s.notes||'—')+'</td><td><button class="text-link" onclick="editStudent(\''+s.id+'\')">تعديل</button> <button class="text-link" style="color:#a35f57" onclick="deleteItem(\'students\',\''+s.id+'\')">حذف</button></td></tr>'}
function attendancePage(){let cls=db.classes[0]?.id||'';return pageHead('متابعة التلاميذ','الحضور والغياب','سجّل حالة التلاميذ لكل يوم واحتفظ بسجل قابل للمراجعة.')+'<div class="card"><div class="toolbar"><select class="filter" id="attClass" onchange="fillAttendanceClass()"><option value="">اختر القسم</option>'+db.classes.map(c=>'<option value="'+c.id+'">'+esc(c.name)+'</option>').join('')+'</select><input class="filter" type="date" id="attDate" value="'+dateNow()+'"><button class="btn primary" onclick="saveAttendance()">حفظ سجل اليوم</button></div><div id="attendanceList">'+(db.classes.length?'اختر القسم لعرض القائمة.':empty('أنشئ قسماً أولاً','تحتاج إلى قسم وتلاميذ قبل تسجيل الحضور.'))+'</div></div><div class="card" style="margin-top:16px"><div class="section-title"><h3>السجلات السابقة</h3><span class="pill">'+count(db.attendance)+' سجل</span></div><div class="table-wrap"><table><thead><tr><th>التاريخ</th><th>التلميذ</th><th>القسم</th><th>الحالة</th></tr></thead><tbody>'+(db.attendance.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,30).map(a=>{let s=db.students.find(x=>x.id===a.studentId),c=db.classes.find(x=>x.id===a.classId);return '<tr><td>'+dateLabel(a.date)+'</td><td>'+esc(s?s.name:'تلميذ محذوف')+'</td><td>'+esc(c?c.name:'—')+'</td><td><span class="status '+(a.status==='غائب'?'absent':'')+'">'+esc(a.status)+'</span></td></tr>'}).join('')||'<tr><td colspan="4" class="muted">لا توجد سجلات سابقة.</td></tr>')+'</tbody></table></div></div>'}
function fillAttendanceClass(){let sel=document.getElementById('attClass');if(!sel)return;let cid=sel.value;let date=document.getElementById('attDate')?.value||dateNow();let list=document.getElementById('attendanceList');if(!cid){list.innerHTML='اختر القسم لعرض القائمة.';return}let students=db.students.filter(s=>s.classId===cid);if(!students.length){list.innerHTML=empty('لا يوجد تلاميذ في هذا القسم','أضف التلاميذ أولاً من صفحة التلاميذ.');return}list.innerHTML='<div class="table-wrap"><table><thead><tr><th>التلميذ</th><th>حاضر</th><th>غائب</th><th>متأخر</th></tr></thead><tbody>'+students.map(s=>{let old=db.attendance.find(a=>a.studentId===s.id&&a.date===date);let v=old?old.status:'حاضر';return '<tr><td class="student-name">'+esc(s.name)+'</td><td><input type="radio" name="att_'+s.id+'" value="حاضر" '+(v==='حاضر'?'checked':'')+'></td><td><input type="radio" name="att_'+s.id+'" value="غائب" '+(v==='غائب'?'checked':'')+'></td><td><input type="radio" name="att_'+s.id+'" value="متأخر" '+(v==='متأخر'?'checked':'')+'></td></tr>'}).join('')+'</tbody></table></div>'}
function saveAttendance(){let cid=document.getElementById('attClass')?.value,date=document.getElementById('attDate')?.value||dateNow();if(!cid){toast('اختر القسم أولاً');return}db.attendance=db.attendance.filter(a=>!(a.classId===cid&&a.date===date));db.students.filter(s=>s.classId===cid).forEach(s=>{let checked=document.querySelector('input[name="att_'+s.id+'"]:checked');db.attendance.push({id:id(),classId:cid,studentId:s.id,date,status:checked?checked.value:'حاضر'})});save();render();toast('تم حفظ سجل الحضور')}
function lessonsPage(){return pageHead('صناعة المحتوى','الدروس والتحضير','خطّط الدرس واكتب مراحله وارسم ملخصاً بصرياً في مساحة العمل.',btn('＋ تحضير درس',"openLesson()"))+'<div class="toolbar"><input class="field-search" placeholder="ابحث في الدروس..." oninput="filterCards(\'lessonCards\',this.value)"></div><div class="cards" id="lessonCards">'+(db.lessons.length?db.lessons.slice().reverse().map(l=>'<article class="item-card" data-search="'+esc((l.title+' '+l.subject+' '+l.level).toLowerCase())+'"><div class="item-top"><div class="item-symbol">▤</div><span class="pill">'+esc(l.subject||'درس')+'</span></div><h3>'+esc(l.title)+'</h3><p>'+esc(l.level||'')+' · '+dateLabel(l.created)+'</p><div class="item-meta"><span class="pill green">'+(l.drawing?'يتضمن ملخصاً مرسوماً':'تحضير نصي')+'</span></div><div class="item-actions">'+btn('عرض',"viewLesson('"+l.id+"')",'light small')+btn('تعديل',"editLesson('"+l.id+"')",'secondary small')+btn('حذف',"deleteItem('lessons','"+l.id+"')",'danger small')+'</div></article>').join(''):empty('مساحة الدروس فارغة','أنشئ درساً يتضمن الأهداف والشرح والأنشطة والملخص البصري.',btn('تحضير أول درس',"openLesson()")) )+'</div>'}
function activitiesPage(){return pageHead('صناعة المحتوى','الأنشطة التفاعلية','أنشئ أنشطة صفية قابلة للتعديل والطباعة، مثل البطاقات والأسئلة والمطابقة.',btn('＋ نشاط جديد',"openActivity()"))+'<div class="cards">'+(db.activities.length?db.activities.slice().reverse().map(a=>'<article class="item-card"><div class="item-top"><div class="item-symbol">◇</div><span class="pill blue">'+esc(a.type)+'</span></div><h3>'+esc(a.title)+'</h3><p>'+esc(a.subject||'')+' · '+esc(a.level||'')+'</p><div class="item-meta"><span class="pill">'+(a.items||[]).length+' عناصر</span></div><div class="item-actions">'+btn('فتح',"viewActivity('"+a.id+"')",'light small')+btn('تعديل',"editActivity('"+a.id+"')",'secondary small')+btn('حذف',"deleteItem('activities','"+a.id+"')",'danger small')+'</div></article>').join(''):empty('لا توجد أنشطة بعد','أنشئ بطاقات مراجعة أو نشاط سؤال وجواب لتستخدمه في القسم.',btn('إنشاء نشاط',"openActivity()")) )+'</div>'}
function assessmentsPage(){return pageHead('متابعة التعلم','التقويم والاختبارات','جهّز تقويماً قصيراً بأسئلة واضحة ومفتاح إجابة وملاحظات.',btn('＋ إعداد تقويم',"openAssessment()"))+'<div class="cards">'+(db.assessments.length?db.assessments.slice().reverse().map(a=>'<article class="item-card"><div class="item-top"><div class="item-symbol">▧</div><span class="pill rose">'+esc(a.kind||'تقويم')+'</span></div><h3>'+esc(a.title)+'</h3><p>'+esc(a.subject||'')+' · '+esc(a.level||'')+'</p><div class="item-meta"><span class="pill">'+(a.questions||[]).length+' أسئلة</span><span class="pill">'+esc(a.duration||'—')+' دقيقة</span></div><div class="item-actions">'+btn('عرض / طباعة',"viewAssessment('"+a.id+"')",'light small')+btn('تعديل',"editAssessment('"+a.id+"')",'secondary small')+btn('حذف',"deleteItem('assessments','"+a.id+"')",'danger small')+'</div></article>').join(''):empty('لا توجد تقويمات بعد','أنشئ تقويماً يتضمن أسئلة متنوعة ومفتاح الإجابة.',btn('إعداد أول تقويم',"openAssessment()")) )+'</div>'}
function libraryPage(){return pageHead('موارد الأستاذ','مكتبة الموارد','اجمع روابطك وملفاتك وملاحظاتك التعليمية في مكان واحد.',btn('＋ إضافة مورد',"openResource()"))+'<div class="cards">'+(db.resources.length?db.resources.slice().reverse().map(r=>'<article class="item-card"><div class="item-top"><div class="item-symbol">▣</div><span class="pill">'+esc(r.kind||'مورد')+'</span></div><h3>'+esc(r.title)+'</h3><p>'+esc(r.note||'لا توجد ملاحظات')+'</p><div class="item-actions">'+(r.url?'<a class="btn light small" target="_blank" rel="noopener" href="'+esc(r.url)+'">فتح الرابط ↗</a>':'')+btn('تعديل',"editResource('"+r.id+"')",'secondary small')+btn('حذف',"deleteItem('resources','"+r.id+"')",'danger small')+'</div></article>').join(''):empty('مكتبتك تنتظر مواردك','أضف رابطاً أو مرجعاً أو ملاحظة لتعود إليها وقت الحاجة.',btn('إضافة أول مورد',"openResource()")) )+'</div>'}
function reportsPage(){let present=db.attendance.filter(a=>a.status==='حاضر').length,absent=db.attendance.filter(a=>a.status==='غائب').length,late=db.attendance.filter(a=>a.status==='متأخر').length;return pageHead('متابعة الأداء','التقارير والإحصاءات','نظرة عامة على بيانات الأقسام والدروس والحضور المسجّل.')+'<div class="stats"><div class="stat"><div class="stat-icon">▦</div><div><strong>'+count(db.classes)+'</strong><small>الأقسام</small></div></div><div class="stat"><div class="stat-icon">♙</div><div><strong>'+count(db.students)+'</strong><small>التلاميذ</small></div></div><div class="stat"><div class="stat-icon">✓</div><div><strong>'+count(db.lessons)+'</strong><small>الدروس</small></div></div><div class="stat"><div class="stat-icon">▧</div><div><strong>'+count(db.assessments)+'</strong><small>التقويمات</small></div></div></div><div class="grid-two"><div class="card"><div class="section-title"><h3>ملخص الحضور</h3><span class="pill">كل السجلات</span></div><div class="list"><div class="list-row"><span>حاضر</span><b style="color:var(--green)">'+count(present)+'</b></div><div class="list-row"><span>غائب</span><b style="color:var(--rose)">'+count(absent)+'</b></div><div class="list-row"><span>متأخر</span><b style="color:var(--gold)">'+count(late)+'</b></div></div></div><div class="card"><div class="section-title"><h3>توزيع التلاميذ</h3></div>'+(db.classes.length?'<div class="list">'+db.classes.map(c=>{let n=db.students.filter(s=>s.classId===c.id).length;return '<div class="list-row"><div><b>'+esc(c.name)+'</b><small class="muted"> · '+esc(c.level||'')+'</small></div><b>'+n+'</b></div>'}).join('')+'</div>':empty('لا توجد بيانات','أضف أقساماً وتلاميذ لعرض التوزيع.'))+'</div></div><div style="margin-top:16px">'+btn('طباعة التقرير',"window.print()",'secondary')+' '+btn('تصدير البيانات',"exportData()",'light')+'</div>'}
function settingsPage(){return pageHead('تخصيص المساحة','الإعدادات','حدّث بياناتك واحتفظ بنسخة احتياطية من عملك.')+'<div class="grid-two"><section class="card"><div class="section-title"><h3>بيانات الأستاذ</h3></div><form onsubmit="saveSettings(event)" class="form-grid"><div class="form-field full"><label>الاسم الذي يظهر في المنصة</label><input name="teacher" value="'+esc(db.teacher)+'" required></div><div class="form-field full"><label>المؤسسة (اختياري)</label><input name="school" value="'+esc(db.school)+'" placeholder="اسم المؤسسة"></div><div class="form-field full"><label>السنة الدراسية</label><input name="year" value="'+esc(db.year)+'"></div><div class="form-field full">'+btn('حفظ الإعدادات','', 'primary')+'</div></form></section><section class="card"><div class="section-title"><h3>النسخ الاحتياطي</h3></div><p class="muted" style="font-size:12px;line-height:1.9">بيانات مِداد محفوظة محلياً في المتصفح على هذا الجهاز. نزّل نسخة JSON للاحتفاظ بها أو استيرادها لاحقاً على جهاز آخر.</p><div style="display:grid;gap:9px">'+btn('⇩ تنزيل نسخة احتياطية',"exportData()")+'<label class="btn light" for="importFile">⇧ استيراد نسخة احتياطية</label><input id="importFile" type="file" accept="application/json,.json" hidden onchange="importData(event)">'+btn('مسح جميع البيانات',"confirmReset()",'danger')+'</div></section></div><div class="card" style="margin-top:16px"><h3 style="color:var(--deep);margin-top:0">حول مِداد</h3><p class="muted" style="font-size:12px;line-height:2">مِداد مساحة تنظيم وإعداد للموارد التعليمية. هذه النسخة تعمل محلياً داخل المتصفح، ولا تتضمن حالياً حسابات مستخدمين أو مزامنة سحابية أو خدمة ذكاء اصطناعي متصلة. احتفظ بنسخة احتياطية دورية من بياناتك.</p></div>'}
function globalSearch(q){if(q.trim().length>1){navigate('lessons');let x=document.querySelector('#lessonCards');if(x)filterCards('lessonCards',q)}}
function filterCards(id,q){let root=document.getElementById(id);if(!root)return;root.querySelectorAll('[data-search]').forEach(x=>x.style.display=x.dataset.search.includes(q.toLowerCase())?'':'none')}
function filterRows(q){let c=document.getElementById('studentClassFilter')?.value||'';document.querySelectorAll('#studentRows tr[data-search]').forEach(x=>x.style.display=x.dataset.search.includes(q.toLowerCase())&&(!c||x.dataset.class===c)?'':'none')}
function openModal(title,desc,body,wide){let m=document.getElementById('modal');m.className='modal'+(wide?' wide':'');m.innerHTML='<div class="modal-head"><div><h2>'+title+'</h2><p>'+desc+'</p></div><button class="close" onclick="closeModal()">×</button></div>'+body;document.getElementById('modalBackdrop').classList.add('show')}
function closeModal(){document.getElementById('modalBackdrop').classList.remove('show');board=null}
function formField(label,name,value,type='text',extra=''){return '<div class="form-field"><label>'+label+'</label><input name="'+name+'" type="'+type+'" value="'+esc(value||'')+'" '+extra+'></div>'}
function openClass(edit){let c=edit?db.classes.find(x=>x.id===edit):{};openModal(edit?'تعديل القسم':'إنشاء قسم','أدخل بيانات القسم لتنظيم التلاميذ والدروس المرتبطة به.','<form onsubmit="saveClass(event,\''+(edit||'')+'\')"><div class="form-grid">'+formField('اسم القسم','name',c.name,'text','required placeholder="مثال: السنة الثالثة — أ"')+'<div class="form-field"><label>الطور</label><select name="stage"><option '+(c.stage==='ابتدائي'?'selected':'')+'>ابتدائي</option><option '+(c.stage==='متوسط'?'selected':'')+'>متوسط</option><option '+(c.stage==='ثانوي'?'selected':'')+'>ثانوي</option><option '+(c.stage==='أخرى'?'selected':'')+'>أخرى</option></select></div>'+formField('المستوى','level',c.level,'text','placeholder="مثال: السنة الثالثة"')+formField('السنة الدراسية','year',c.year||db.year)+formField('العدد المتوقع','capacity',c.capacity,'number','min="1" placeholder="مثال: 30"')+'</div><div class="modal-actions"><button class="btn primary">حفظ القسم</button><button type="button" class="btn light" onclick="closeModal()">إلغاء</button></div></form>')}
function saveClass(e,edit){e.preventDefault();let f=new FormData(e.target),v=Object.fromEntries(f.entries());if(edit)Object.assign(db.classes.find(x=>x.id===edit),v);else db.classes.push({id:id(),...v});save();closeModal();render();toast('تم حفظ بيانات القسم')}
function openStudent(edit){if(!db.classes.length){toast('أنشئ قسماً أولاً');return}let s=edit?db.students.find(x=>x.id===edit):{};openModal(edit?'تعديل بيانات التلميذ':'إضافة تلميذ','سجّل المعلومات الأساسية واربط التلميذ بقسمه.','<form onsubmit="saveStudent(event,\''+(edit||'')+'\')"><div class="form-grid">'+formField('اسم التلميذ','name',s.name,'text','required placeholder="الاسم واللقب"')+'<div class="form-field"><label>القسم</label><select name="classId" required>'+db.classes.map(c=>'<option value="'+c.id+'" '+(s.classId===c.id?'selected':'')+'>'+esc(c.name)+'</option>').join('')+'</select></div>'+formField('رقم/معرّف (اختياري)','number',s.number)+ '<div class="form-field full"><label>ملاحظات</label><textarea name="notes" placeholder="ملاحظات تربوية أو تنظيمية...">'+esc(s.notes||'')+'</textarea></div></div><div class="modal-actions"><button class="btn primary">حفظ التلميذ</button><button type="button" class="btn light" onclick="closeModal()">إلغاء</button></div></form>')}
function saveStudent(e,edit){e.preventDefault();let v=Object.fromEntries(new FormData(e.target).entries());if(edit)Object.assign(db.students.find(x=>x.id===edit),v);else db.students.push({id:id(),...v});save();closeModal();render();toast('تم حفظ بيانات التلميذ')}
function editClass(x){openClass(x)}function editStudent(x){openStudent(x)}function classStudents(cid){navigate('students');document.getElementById('studentClassFilter').value=cid;filterRows('')}
function deleteItem(type,x){if(!confirm('هل تريد حذف هذا العنصر؟'))return;db[type]=db[type].filter(v=>v.id!==x);if(type==='classes'){db.students=db.students.filter(s=>s.classId!==x);db.attendance=db.attendance.filter(a=>a.classId!==x)}save();render();toast('تم الحذف')}
function openLesson(edit){let l=edit?db.lessons.find(x=>x.id===edit):{};openModal(edit?'تعديل الدرس':'مساحة تحضير الدرس','خطّط الدرس واكتب محتواه، ثم استخدم اللوحة لرسم خريطة أو ملخص بصري.', '<form id="lessonForm" onsubmit="saveLesson(event,\''+(edit||'')+'\')"><div class="form-grid">'+formField('عنوان الدرس','title',l.title,'text','required placeholder="عنوان واضح للدرس"')+formField('المادة','subject',l.subject,'text','placeholder="اللغة العربية، الرياضيات..."')+formField('المستوى','level',l.level,'text','placeholder="المستوى الدراسي"')+formField('التاريخ','created',l.created||dateNow(),'date')+'<div class="form-field full"><label>الأهداف التعليمية</label><textarea name="objectives" placeholder="في نهاية الدرس يُتوقع من المتعلم أن...">'+esc(l.objectives||'')+'</textarea></div><div class="form-field full"><label>التمهيد / وضعية الانطلاق</label><textarea name="intro" placeholder="كيف تهيّئ المتعلمين للدرس؟">'+esc(l.intro||'')+'</textarea></div><div class="form-field full"><label>بناء التعلمات والشرح</label><textarea name="content" style="min-height:130px" placeholder="اكتب مراحل الدرس والأمثلة والتوضيحات...">'+esc(l.content||'')+'</textarea></div><div class="form-field full"><label>التطبيق والتقويم</label><textarea name="practice" placeholder="تمارين، أسئلة، أو مهمة ختامية...">'+esc(l.practice||'')+'</textarea></div></div><div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin:20px 0 10px"><div><b style="color:var(--deep)">لوحة التلخيص والرسم</b><div class="muted" style="font-size:11px">ارسم مخططاً أو اكتب بخط اليد أو أضف توضيحاً بصرياً.</div></div><span class="pill">مساحة حرة</span></div><div class="board-layout"><div class="board-wrap"><div class="board-top"><div class="board-tools"><button type="button" class="tool active" id="penTool" onclick="setBoardTool(\'pen\')">قلم</button><button type="button" class="tool" id="eraseTool" onclick="setBoardTool(\'erase\')">ممحاة</button><button type="button" class="tool" onclick="undoBoard()">تراجع</button><button type="button" class="tool" onclick="clearBoard()">مسح اللوحة</button></div><button type="button" class="tool" onclick="downloadBoard()">تنزيل الرسم</button></div><canvas id="lessonBoard"></canvas></div><aside class="board-side"><h4>أدوات الرسم</h4><label style="font-size:11px">لون القلم</label><input type="color" id="boardColor" value="'+esc(l.color||'#563829')+'" onchange="boardColor=this.value"><label style="font-size:11px">سُمك القلم</label><input type="range" min="1" max="18" value="4" id="boardSize" oninput="boardSize=+this.value"><p>يمكنك الرسم باللمس على الهاتف أو باستخدام الفأرة. استخدم التراجع لإلغاء آخر خطوة.</p><button type="button" class="btn light small" onclick="downloadBoard()">حفظ الرسم كصورة</button></aside></div><input type="hidden" name="drawing" id="drawingField"></form><div class="modal-actions"><button class="btn primary" onclick="submitLesson()">حفظ الدرس</button><button class="btn light" onclick="closeModal()">إلغاء</button></div>',true);setupBoard(l.drawing)}
function setupBoard(saved){board=document.getElementById('lessonBoard');if(!board)return;boardCtx=board.getContext('2d');boardHistory=[];let resize=()=>{let old=document.createElement('canvas');old.width=board.width;old.height=board.height;if(board.width&&board.height)old.getContext('2d').drawImage(board,0,0);let rect=board.getBoundingClientRect();let dpr=Math.min(window.devicePixelRatio||1,2);board.width=rect.width*dpr;board.height=rect.height*dpr;boardCtx=board.getContext('2d');boardCtx.scale(dpr,dpr);boardCtx.lineCap='round';boardCtx.lineJoin='round';if(saved){let im=new Image();im.onload=()=>boardCtx.drawImage(im,0,0,rect.width,rect.height);im.src=saved;saved=null}else if(old.width){boardCtx.drawImage(old,0,0,old.width,old.height,0,0,rect.width,rect.height)}};resize();board._resize=resize;let pos=e=>{let r=board.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}};board.onpointerdown=e=>{e.preventDefault();boardDrawing=true;board.setPointerCapture(e.pointerId);boardHistory.push(board.toDataURL());if(boardHistory.length>25)boardHistory.shift();let p=pos(e);boardCtx.beginPath();boardCtx.moveTo(p.x,p.y);boardCtx.strokeStyle=boardTool==='erase'?'#ffffff':boardColor;boardCtx.lineWidth=boardTool==='erase'?boardSize*4:boardSize};board.onpointermove=e=>{if(!boardDrawing)return;let p=pos(e);boardCtx.lineTo(p.x,p.y);boardCtx.stroke()};board.onpointerup=()=>boardDrawing=false;board.onpointercancel=()=>boardDrawing=false;window.addEventListener('resize',()=>{if(document.getElementById('lessonBoard')&&board===document.getElementById('lessonBoard'))board._resize()},{passive:true})}
function setBoardTool(t){boardTool=t;document.getElementById('penTool')?.classList.toggle('active',t==='pen');document.getElementById('eraseTool')?.classList.toggle('active',t==='erase')}
function undoBoard(){if(!board||!boardHistory.length)return;let src=boardHistory.pop(),im=new Image();im.onload=()=>{let r=board.getBoundingClientRect();boardCtx.clearRect(0,0,r.width,r.height);boardCtx.drawImage(im,0,0,r.width,r.height)};im.src=src}
function clearBoard(){if(!board||!confirm('مسح محتوى اللوحة؟'))return;boardHistory.push(board.toDataURL());let r=board.getBoundingClientRect();boardCtx.clearRect(0,0,r.width,r.height)}
function downloadBoard(){if(!board)return;let a=document.createElement('a');a.href=board.toDataURL('image/png');a.download='midad-summary.png';a.click()}
function submitLesson(){let f=document.getElementById('lessonForm');if(!f.reportValidity())return;let canvas=document.getElementById('lessonBoard');document.getElementById('drawingField').value=canvas?canvas.toDataURL('image/jpeg',.75):'';f.requestSubmit()}
function saveLesson(e,edit){e.preventDefault();let v=Object.fromEntries(new FormData(e.target).entries());if(edit)Object.assign(db.lessons.find(x=>x.id===edit),v);else db.lessons.push({id:id(),...v});save();closeModal();navigate('lessons');toast('تم حفظ الدرس والملخص')}
function editLesson(x){openLesson(x)}
function viewLesson(x){let l=db.lessons.find(v=>v.id===x);if(!l)return;openModal(esc(l.title),'معاينة التحضير التعليمي','<div class="lesson-preview"><b>المادة:</b> '+esc(l.subject)+'　 <b>المستوى:</b> '+esc(l.level)+'<br><b>الأهداف التعليمية</b><br>'+esc(l.objectives)+'<br><b>التمهيد</b><br>'+esc(l.intro)+'<br><b>بناء التعلمات</b><br>'+esc(l.content)+'<br><b>التطبيق والتقويم</b><br>'+esc(l.practice)+'</div>'+(l.drawing?'<div style="margin-top:14px"><b>الملخص البصري</b><img src="'+l.drawing+'" style="width:100%;margin-top:8px;border:1px solid var(--line);border-radius:12px"></div>':'')+'<div class="modal-actions">'+btn('طباعة',"printLesson('"+l.id+"')")+' '+btn('إغلاق','closeModal()','light')+'</div>',true)}
function printLesson(x){let l=db.lessons.find(v=>v.id===x);if(!l)return;let w=window.open('','_blank');w.document.write('<html dir="rtl" lang="ar"><meta charset="utf-8"><title>'+esc(l.title)+'</title><style>body{font-family:Arial;padding:35px;line-height:2;color:#30231d}h1{color:#563829}img{max-width:100%}</style><h1>'+esc(l.title)+'</h1><p>'+esc(l.subject)+' — '+esc(l.level)+'</p><h3>الأهداف</h3><p>'+esc(l.objectives)+'</p><h3>التمهيد</h3><p>'+esc(l.intro)+'</p><h3>بناء التعلمات</h3><p>'+esc(l.content)+'</p><h3>التطبيق والتقويم</h3><p>'+esc(l.practice)+'</p>'+(l.drawing?'<h3>الملخص البصري</h3><img src="'+l.drawing+'">':'')+'</html>');w.document.close();w.print()}
function openActivity(edit){let a=edit?db.activities.find(x=>x.id===edit):{};openModal(edit?'تعديل النشاط':'إنشاء نشاط تفاعلي','أنشئ بطاقات سؤال وجواب أو نشاط مراجعة بسيطاً.','<form onsubmit="saveActivity(event,\''+(edit||'')+'\')"><div class="form-grid">'+formField('عنوان النشاط','title',a.title,'text','required')+formField('المادة','subject',a.subject)+formField('المستوى','level',a.level)+'<div class="form-field"><label>نوع النشاط</label><select name="type"><option '+(a.type==='بطاقات سؤال وجواب'?'selected':'')+'>بطاقات سؤال وجواب</option><option '+(a.type==='مراجعة سريعة'?'selected':'')+'>مراجعة سريعة</option><option '+(a.type==='مفردات ومعانٍ'?'selected':'')+'>مفردات ومعانٍ</option><option '+(a.type==='توصيل ومطابقة'?'selected':'')+'>توصيل ومطابقة</option></select></div><div class="form-field full"><label>العناصر — اكتب سؤالاً ثم الإجابة في كل سطر بهذا الشكل: السؤال | الإجابة</label><textarea name="itemsText" style="min-height:150px" placeholder="ما عاصمة الجزائر؟ | الجزائر&#10;كم عدد أيام الأسبوع؟ | سبعة">'+esc((a.items||[]).map(x=>x.q+' | '+x.a).join('\\n'))+'</textarea></div></div><div class="modal-actions"><button class="btn primary">حفظ النشاط</button><button type="button" class="btn light" onclick="closeModal()">إلغاء</button></div></form>')}
function saveActivity(e,edit){e.preventDefault();let v=Object.fromEntries(new FormData(e.target).entries());v.items=v.itemsText.split('\\n').map(x=>x.split('|')).filter(x=>x[0]?.trim()).map(x=>({q:x[0].trim(),a:(x[1]||'').trim()}));delete v.itemsText;if(edit)Object.assign(db.activities.find(x=>x.id===edit),v);else db.activities.push({id:id(),...v});save();closeModal();render();toast('تم حفظ النشاط')}
function editActivity(x){openActivity(x)}
function viewActivity(x){let a=db.activities.find(v=>v.id===x);if(!a)return;openModal(esc(a.title),'بطاقات النشاط — '+esc(a.type),'<div class="cards" style="grid-template-columns:repeat(2,minmax(0,1fr))">'+(a.items||[]).map((it,i)=>'<div class="item-card"><span class="pill">بطاقة '+(i+1)+'</span><h3>'+esc(it.q)+'</h3><p>الإجابة: '+esc(it.a||'لم تُحدّد')+'</p></div>').join('')+'</div><div class="modal-actions">'+btn('طباعة',"window.print()")+' '+btn('إغلاق','closeModal()','light')+'</div>',true)}
function openAssessment(edit){let a=edit?db.assessments.find(x=>x.id===edit):{};openModal(edit?'تعديل التقويم':'إعداد تقويم أو اختبار','أضف الأسئلة والإجابات النموذجية ثم احفظها للطباعة.', '<form onsubmit="saveAssessment(event,\''+(edit||'')+'\')"><div class="form-grid">'+formField('عنوان التقويم','title',a.title,'text','required')+formField('المادة','subject',a.subject)+formField('المستوى','level',a.level)+'<div class="form-field"><label>النوع</label><select name="kind"><option>تقويم تشخيصي</option><option>تقويم تكويني</option><option>اختبار قصير</option><option>واجب منزلي</option></select></div>'+formField('المدة بالدقائق','duration',a.duration,'number')+'<div class="form-field full"><label>الأسئلة — سؤال في كل سطر، ويمكن وضع الإجابة بعد |</label><textarea name="questionsText" style="min-height:170px" placeholder="السؤال الأول | الإجابة النموذجية&#10;السؤال الثاني | الإجابة النموذجية">'+esc((a.questions||[]).map(q=>q.q+' | '+q.a).join('\\n'))+'</textarea></div></div><div class="modal-actions"><button class="btn primary">حفظ التقويم</button><button type="button" class="btn light" onclick="closeModal()">إلغاء</button></div></form>')}
function saveAssessment(e,edit){e.preventDefault();let v=Object.fromEntries(new FormData(e.target).entries());v.questions=v.questionsText.split('\\n').map(x=>x.split('|')).filter(x=>x[0]?.trim()).map(x=>({q:x[0].trim(),a:(x[1]||'').trim()}));delete v.questionsText;if(edit)Object.assign(db.assessments.find(x=>x.id===edit),v);else db.assessments.push({id:id(),...v});save();closeModal();render();toast('تم حفظ التقويم')}
function editAssessment(x){openAssessment(x)}
function viewAssessment(x){let a=db.assessments.find(v=>v.id===x);if(!a)return;openModal(esc(a.title),'معاينة ورقة التقويم','<div class="lesson-preview"><h3>'+esc(a.kind)+' — '+esc(a.subject)+'</h3><p>الاسم: .............................................　التاريخ: ................</p>'+(a.questions||[]).map((q,i)=>'<p><b>'+(i+1)+'. '+esc(q.q)+'</b><br><span style="color:#999">..............................................................................</span></p>').join('')+'<hr><b>مفتاح الإجابة للأستاذ</b><br>'+(a.questions||[]).map((q,i)=>(i+1)+'. '+esc(q.a)).join('<br>')+'</div><div class="modal-actions">'+btn('طباعة',"window.print()")+' '+btn('إغلاق','closeModal()','light')+'</div>',true)}
function openResource(edit){let r=edit?db.resources.find(x=>x.id===edit):{};openModal(edit?'تعديل المورد':'إضافة مورد إلى المكتبة','احفظ مرجعاً أو رابطاً للعودة إليه لاحقاً.','<form onsubmit="saveResource(event,\''+(edit||'')+'\')"><div class="form-grid">'+formField('عنوان المورد','title',r.title,'text','required')+'<div class="form-field"><label>نوع المورد</label><select name="kind"><option>رابط تعليمي</option><option>مرجع</option><option>فكرة نشاط</option><option>ملاحظة</option><option>أخرى</option></select></div><div class="form-field full"><label>الرابط (اختياري)</label><input type="url" name="url" value="'+esc(r.url||'')+'" placeholder="https://..."></div><div class="form-field full"><label>ملاحظات</label><textarea name="note">'+esc(r.note||'')+'</textarea></div></div><div class="modal-actions"><button class="btn primary">حفظ المورد</button><button type="button" class="btn light" onclick="closeModal()">إلغاء</button></div></form>')}
function saveResource(e,edit){e.preventDefault();let v=Object.fromEntries(new FormData(e.target).entries());if(edit)Object.assign(db.resources.find(x=>x.id===edit),v);else db.resources.push({id:id(),...v});save();closeModal();render();toast('تم حفظ المورد')}
function editResource(x){openResource(x)}
function saveSettings(e){e.preventDefault();let v=Object.fromEntries(new FormData(e.target).entries());Object.assign(db,v);save();render();toast('تم تحديث الإعدادات')}
function exportData(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='midad-backup-'+dateNow()+'.json';a.click();URL.revokeObjectURL(a.href);toast('تم تجهيز النسخة الاحتياطية')}
function importData(e){let file=e.target.files[0];if(!file)return;let reader=new FileReader();reader.onload=()=>{try{let v=JSON.parse(reader.result);if(!v||typeof v!=='object'||!Array.isArray(v.classes)||!Array.isArray(v.students))throw new Error();db=Object.assign({},defaults,v);save();render();toast('تم استيراد البيانات بنجاح')}catch(err){toast('الملف غير صالح أو ليس نسخة مِداد')}};reader.readAsText(file)}
function confirmReset(){if(!confirm('سيتم حذف جميع بيانات مِداد من هذا المتصفح. هل أنشأت نسخة احتياطية؟'))return;if(!confirm('تأكيد أخير: حذف جميع الأقسام والتلاميذ والدروس؟'))return;db={...defaults};save();render();toast('تمت إعادة تهيئة المساحة')}
render();
</script>
