/* MIDAD VISUAL REDESIGN — cocoa & vanilla clay interface */
:root{
 --bg:#f3eadf;--paper:#fffaf2;--white:#fffdf9;--cream:#f8f0e6;--latte:#ead8c5;
 --sand:#d7b99f;--cocoa:#79513d;--deep:#563829;--ink:#30231d;--muted:#8e786a;
 --line:#eadbcb;--green:#66836d;--blue:#71899a;--rose:#b97870;--gold:#b58a4b;
 --shadow:10px 12px 26px rgba(91,61,43,.10),-7px -7px 18px rgba(255,255,255,.78);
 --shadow-sm:5px 7px 16px rgba(91,61,43,.09),-4px -4px 12px rgba(255,255,255,.85);
 --shadow-in:inset 3px 3px 8px rgba(112,76,54,.10),inset -3px -3px 8px rgba(255,255,255,.85);
 --r:24px
}
body{background:radial-gradient(ellipse at 12% 4%,#fff8ed 0,transparent 32%),linear-gradient(145deg,#f5eee5,#eee2d5);color:var(--ink)}
.topbar{height:82px;background:rgba(255,250,242,.88);border-bottom:1px solid #e6d7c7;box-shadow:0 5px 22px rgba(86,56,41,.05)}
.brand{gap:13px}.brand-mark{width:48px;height:48px;border-radius:17px;background:linear-gradient(145deg,#79513d,#563829);box-shadow:5px 6px 12px #56382935,-3px -3px 8px #fff8ef;color:#fff8ef;font-size:23px}
.brand-name{font-size:26px;letter-spacing:-.5px}.brand-tag{font-size:11px;letter-spacing:.15px}
.search{height:44px;border:0;background:#f6eee5;box-shadow:var(--shadow-in);border-radius:15px}
.icon-btn{border:0;background:#f4e9dc;box-shadow:var(--shadow-sm);transition:.2s}.icon-btn:hover{transform:translateY(-2px)}
.profile{border-color:#e7d9ca}.avatar{background:linear-gradient(145deg,#f2e4d4,#dfc5ad);box-shadow:var(--shadow-sm)}
.shell{width:min(1600px,100%);padding-top:27px;gap:27px;grid-template-columns:252px minmax(0,1fr)}
.sidebar{top:105px;height:calc(100vh - 130px);border-radius:28px;padding:20px 14px;background:linear-gradient(155deg,#684633 0%,#563829 55%,#493024 100%);box-shadow:9px 12px 24px #56382925,-4px -4px 13px #fff8ef;position:sticky}
.side-heading{padding:8px 12px 20px;border-bottom:1px solid #ffffff25}
.side-heading b{font-size:14px;color:#fff8ef}.side-heading p{color:#ddc7b5;font-size:12px;line-height:1.9}
.nav-label{color:#d3ad91;font-size:10px;padding:16px 12px 7px}
.nav{gap:6px}.nav button{padding:12px 13px;border-radius:14px;color:#f0e2d6;font-size:13px;transition:transform .2s,background .2s,box-shadow .2s}
.nav button:hover{background:#ffffff16;transform:translateX(-3px)}
.nav button.active{background:linear-gradient(145deg,#fffaf2,#f0e2d3);color:var(--deep);box-shadow:4px 5px 10px #2e1d1538,inset 2px 2px 4px #fff;transform:translateY(-1px)}
.nav .ni{font-size:16px}.side-bottom{color:#d6bba6;line-height:2}
main{animation:fade .32s ease}
.page-head{margin:6px 0 24px;align-items:center}
.eyebrow{font-size:11px;letter-spacing:1px;color:#987052}
.page-head h1{font-size:32px;letter-spacing:-.5px;margin:7px 0 5px;color:var(--deep)}
.page-head p{font-size:13px;color:#927c6c}
.btn{border-radius:14px;padding:12px 18px;box-shadow:3px 4px 9px rgba(86,56,41,.10),-2px -2px 6px rgba(255,255,255,.55);font-weight:800}
.btn:hover{transform:translateY(-2px);box-shadow:5px 7px 13px rgba(86,56,41,.15),-2px -2px 6px rgba(255,255,255,.6)}
.btn:active{transform:translateY(1px);box-shadow:var(--shadow-in)}
.primary{background:linear-gradient(145deg,#79513d,#563829);color:#fff8ef}
.secondary{background:linear-gradient(145deg,#f0e1d1,#e3cbb5);color:#563829}
.light{background:linear-gradient(145deg,#fffdf9,#f4eadd);border:1px solid #ebdfd2;color:#79513d}
.danger{background:#f4e5e0;color:#96574e}
.card{background:linear-gradient(145deg,#fffdf9,#fff8ef);border:1px solid #f1e5d9;border-radius:25px;padding:22px;box-shadow:var(--shadow)}
.hero{grid-template-columns:1.25fr .75fr;padding:34px 35px;border:1px solid #e9d7c4;border-radius:30px;background:linear-gradient(125deg,#fffaf2 0%,#f3e4d4 68%,#ead6c2 100%);box-shadow:10px 13px 28px rgba(91,61,43,.11),-6px -6px 17px rgba(255,255,255,.85);margin-bottom:23px}
.hero:after{width:290px;height:290px;border-color:#a87d5c38;left:-100px;top:-145px;box-shadow:0 0 0 26px #b98d6b0c,0 0 0 58px #b98d6b08,0 0 0 90px #b98d6b06}
.hero-kicker{font-size:12px;color:#9a6c4c;letter-spacing:.4px}
.hero h2{font-size:31px;line-height:1.5;margin:12px 0;color:#503326}
.hero p{font-size:14px;line-height:2;color:#806b5e;max-width:600px}
.hero-art{min-height:190px}
.paper-stack{width:166px;height:166px;filter:drop-shadow(7px 10px 9px #56382920)}
.paper-stack span{inset:12px 8px;border-radius:20px;box-shadow:0 15px 26px #5638291e}
.paper-stack span:nth-child(2){background:#e8d3bd}.paper-stack span:nth-child(3){background:linear-gradient(145deg,#89634c,#563829);font-size:43px}
.stats{gap:15px;margin-bottom:23px}
.stat{padding:19px 18px;border:1px solid #f0e4d8;border-radius:21px;background:linear-gradient(145deg,#fffdf9,#f8f0e7);box-shadow:var(--shadow-sm);transition:transform .2s,box-shadow .2s}
.stat:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.stat-icon{width:47px;height:47px;border-radius:16px;background:linear-gradient(145deg,#f6eadc,#ead7c4);box-shadow:inset 2px 2px 4px #fff,3px 4px 8px #79513d15;color:#79513d}
.stat:nth-child(2) .stat-icon{background:linear-gradient(145deg,#edf2e9,#dce7da)}
.stat:nth-child(3) .stat-icon{background:linear-gradient(145deg,#eff2f4,#dce5eb)}
.stat:nth-child(4) .stat-icon{background:linear-gradient(145deg,#f7eeeb,#efdcd6)}
.stat strong{font-size:26px;color:#563829}.stat small{font-size:11px;color:#8e786a}
.grid-two{gap:19px}
.section-title{margin-bottom:18px}.section-title h3{font-size:18px;color:#563829}.section-title p{font-size:11px;color:#927c6c}
.quick-grid{gap:13px}.quick{border:1px solid #eddfd1;border-radius:19px;padding:17px;background:linear-gradient(145deg,#fffdf9,#f7eee4);box-shadow:3px 4px 10px #79513d0c,-3px -3px 8px #fff;transition:.2s}
.quick:hover{transform:translateY(-3px);box-shadow:var(--shadow-sm);border-color:#d8b99e}
.quick .qico{width:42px;height:42px;border-radius:15px;background:linear-gradient(145deg,#f4e5d5,#e7d1bd);box-shadow:inset 2px 2px 4px #fff,3px 4px 8px #79513d12;color:#694631;margin-bottom:12px}
.quick b{font-size:14px;color:#563829}.quick small{font-size:11px;color:#927c6c}
.list-row{padding:13px 0;border-color:#f0e6dc}.mini-icon{border-radius:13px;background:linear-gradient(145deg,#f4e8dc,#ead8c6);box-shadow:inset 1px 1px 3px #fff}
.empty{padding:42px 20px;border:1px dashed #d8c2ae;border-radius:20px;background:linear-gradient(145deg,#fffdf9,#f8f0e7)}
.empty strong{font-size:16px;color:#563829}.empty span{font-size:12px;line-height:2}
.toolbar{gap:11px;margin-bottom:18px}
.field-search,.filter{height:45px;border:1px solid #eadbcb;border-radius:14px;background:#fffaf3;box-shadow:inset 2px 2px 5px #79513d0b, inset -2px -2px 5px #fff;padding-inline:14px}
.field-search:focus,.filter:focus{border-color:#b48a6a;box-shadow:0 0 0 3px #b48a6a20}
.cards{gap:17px}
.item-card{border:1px solid #f0e4d8;border-radius:22px;padding:19px;background:linear-gradient(145deg,#fffdf9,#f9f1e8);box-shadow:var(--shadow-sm);transition:transform .22s,box-shadow .22s}
.item-card:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
.item-symbol{width:46px;height:46px;border-radius:16px;background:linear-gradient(145deg,#f4e7d9,#e7d2be);box-shadow:inset 2px 2px 4px #fff,3px 4px 8px #79513d14;font-size:19px}
.item-card h3{font-size:17px;margin:15px 0 5px;color:#563829}.item-card p{font-size:12px;line-height:1.9;color:#927c6c}
.pill{background:#f1e6da;color:#795b46;border:1px solid #eadbcb;padding:6px 10px;font-size:10px}
.pill.green{background:#eaf0e8;color:#56745b;border-color:#dce7d9}.pill.blue{background:#eaf0f3;color:#5d7789;border-color:#dce5eb}.pill.rose{background:#f5e9e5;color:#99645c;border-color:#efddd7}
.item-actions{gap:8px}.item-actions .btn{min-width:0}
.table-wrap{border:1px solid #ecdfd2;border-radius:20px;box-shadow:var(--shadow-sm);background:#fffdf9}
th{background:#f5ece2;color:#78553e}th,td{padding:14px 15px}td{font-size:12px}
.student-name{color:#563829}.status{background:#e9f0e8;color:#56745b}.status.absent{background:#f5e8e4;color:#9a5f57}
.modal-backdrop{background:#34231988;backdrop-filter:blur(7px)}
.modal{background:linear-gradient(145deg,#fffaf2,#f4eadd);border:1px solid #fff8ef;border-radius:27px;box-shadow:12px 16px 40px #24160f55}
.modal-head h2{font-size:22px;color:#563829}.close{background:#f0e2d4;box-shadow:var(--shadow-sm)}
.form-field label{color:#79513d;font-size:12px}.form-field input,.form-field select,.form-field textarea{border:1px solid #e8d9ca;border-radius:13px;background:#fffdf9;box-shadow:inset 2px 2px 5px #79513d08,inset -2px -2px 5px #fff;padding:12px 13px}
.form-field input:focus,.form-field select:focus,.form-field textarea:focus{border-color:#a98263;box-shadow:0 0 0 3px #a9826320}
.board-wrap{border-radius:18px;box-shadow:var(--shadow-sm)}.board-top{background:#f5ece2}.board-side{background:linear-gradient(145deg,#f8f0e7,#eee0d0);border-radius:18px}
.tool{border-radius:10px;background:#fffaf3;box-shadow:var(--shadow-sm)}.tool.active{background:#563829;color:#fff}
.lesson-preview{border-radius:17px;background:#fffdf9;border-color:#ebdfd2;line-height:2.1}
.toast{border-radius:15px;background:#563829;box-shadow:var(--shadow)}
.footer-note{color:#a08b7c}
@media(max-width:1100px){.shell{grid-template-columns:220px minmax(0,1fr)}}
@media(max-width:760px){
 .topbar{height:68px;padding:0 14px}.brand-mark{width:42px;height:42px;border-radius:14px}.brand-name{font-size:23px}
 .shell{padding:17px 13px 100px}.page-head{margin:4px 0 20px;gap:12px}.page-head h1{font-size:27px}
 .hero{padding:24px 21px;border-radius:24px;grid-template-columns:1fr}.hero h2{font-size:25px;line-height:1.5}.hero p{font-size:13px}
 .stats{gap:10px}.stat{padding:14px 12px;border-radius:17px;gap:10px}.stat-icon{width:39px;height:39px;border-radius:13px}.stat strong{font-size:22px}
 .card{padding:18px;border-radius:21px}.quick{padding:14px;border-radius:17px}
 .cards{gap:13px}.item-card{padding:17px;border-radius:19px}
 .mobile-nav{padding:9px 5px calc(9px + env(safe-area-inset-bottom));background:rgba(255,250,242,.94);box-shadow:0 -5px 20px #5638290b;border-top:1px solid #eadbcb}
 .mobile-nav button{font-size:10px;gap:4px}.mobile-nav button span{font-size:19px}.mobile-nav button.active{color:#563829}
 .modal{border-radius:22px}.board-wrap canvas{height:340px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;transition-duration:.01ms!important}}



.alphabet-song-video{width:100%;aspect-ratio:16/9;overflow:hidden;border-radius:18px;background:#241a16;border:1px solid #d8c0aa;box-shadow:0 8px 22px rgba(86,56,41,.14);margin-bottom:16px}
.alphabet-song-video iframe{width:100%;height:100%;border:0;display:block}
.alphabet-source{font-size:12px;color:#79513d;margin:0 0 14px;line-height:1.8}

/* Alphabet sing-along lesson */
.alphabet-song{background:linear-gradient(145deg,#fffaf2,#ead8c5);border:1px solid #e2cbb5;border-radius:24px;padding:clamp(16px,3vw,28px);color:#563829}
.alphabet-song .song-stage{min-height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:rgba(255,255,255,.72);border:1px solid #ead8c5;border-radius:22px;padding:22px;box-shadow:inset 3px 3px 8px rgba(121,81,61,.08),inset -3px -3px 8px #fff}
.alphabet-song .song-letter{font-size:clamp(76px,18vw,126px);font-weight:900;line-height:1.15;color:#79513d;text-shadow:3px 4px 0 #ead8c5;animation:letterPop .35s ease}
.alphabet-song .song-line{font-size:clamp(18px,4vw,25px);font-weight:800;line-height:1.9;margin-top:12px}
.alphabet-song .song-word{display:inline-block;margin-top:8px;padding:5px 14px;border-radius:999px;background:#f1e2d2;color:#79513d;font-weight:700}
.alphabet-song .song-progress{height:8px;background:#ead8c5;border-radius:20px;overflow:hidden;margin:18px 0 8px}
.alphabet-song .song-progress span{display:block;height:100%;background:#79513d;border-radius:20px;transition:width .25s}
.alphabet-song .song-controls{display:flex;flex-wrap:wrap;justify-content:center;gap:9px;margin-top:16px}
.alphabet-song .song-controls button{border:0;border-radius:14px;padding:11px 17px;background:#fffaf2;color:#563829;font:inherit;font-weight:800;box-shadow:4px 4px 9px #d7c1ad,-4px -4px 9px #fff;cursor:pointer}
.alphabet-song .song-controls button.primary-song{background:#79513d;color:white}
.alphabet-song .song-controls button:active{box-shadow:inset 3px 3px 7px rgba(86,56,41,.2)}
.alphabet-song .song-note{font-size:12px;color:#79513d;text-align:center;margin-top:12px;line-height:1.8}
.alphabet-feature{border:1px solid #e2cbb5;background:linear-gradient(120deg,#fffaf2,#f0e1d2);border-radius:20px;padding:18px;display:flex;align-items:center;justify-content:space-between;gap:14px;margin:0 0 18px;flex-wrap:wrap}
.alphabet-feature h3{margin:0 0 5px;color:#563829}.alphabet-feature p{margin:0;color:#79513d;font-size:13px}
@keyframes letterPop{from{opacity:.35;transform:scale(.82)}to{opacity:1;transform:scale(1)}}

</style>

<body>
<div class="app">

</div>
<div class="modal-backdrop" id="modalBackdrop" onclick="if(event.target===this)closeModal()"><section class="modal" id="modal"></section></div>
<div class="toast" id="toast"></div>
<script>
const KEY='midad_workspace_v3';
const defaults={teacher:'الأستاذ',school:'',year:'2026 / 2027',aiEndpoint:'',classes:[],students:[],lessons:[],activities:[],assessments:[],attendance:[],resources:[]};
let db=load(),page='home',board=null,boardCtx=null,boardDrawing=false,boardTool='pen',boardColor='#563829',boardSize=4,boardHistory=[];
function load(){try{return Object.assign({},defaults,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){return {...defaults}}}
function save(){localStorage.setItem(KEY,JSON.stringify(db));}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(s){let t=document.getElementById('toast');t.textContent=s;t.classList.add('show');clearTimeout(window._toast);window._toast=setTimeout(()=>t.classList.remove('show'),2600)}
function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function dateNow(){return new Date().toISOString().slice(0,10)}
function dateLabel(d){if(!d)return '—';try{return new Date(d+'T12:00:00').toLocaleDateString('ar-DZ',{year:'numeric',month:'short',day:'numeric'})}catch(e){return d}}
function count(arr){return arr.length.toLocaleString('ar-DZ')}
function pageHead(kicker,title,desc,action){return '<div class="page-head"><div><div class="eyebrow">'+kicker+'</div><h1>'+title+'</h1><p>'+desc+'</p></div>'+(action||'')+'</div>'}
function empty(title,desc,button){return '<div class="empty"><strong>'+title+'</strong><span>'+desc+'</span>'+(button?'<div style="margin-top:14px">'+button+'</div>':'')+'</div>'}
function btn(label,fn,kind='primary',icon=''){return '<button class="btn '+kind+'" onclick="'+fn+'">'+(icon?icon+' ':'')+label+'</button>'}
function navigate(p){page=p;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render();window.scrollTo({top:0,behavior:'smooth'})}
function render(){let m=document.getElementById('main');let views={home:homePage,classes:classesPage,students:studentsPage,attendance:attendancePage,lessons:lessonsPage,activities:activitiesPage,assessments:assessmentsPage,library:libraryPage,reports:reportsPage,settings:settingsPage};m.innerHTML=(views[page]||homePage)();document.getElementById('teacherName').textContent=db.teacher||'الأستاذ';document.getElementById('avatar').textContent=(db.teacher||'أ').trim().charAt(0);if(page==='attendance')fillAttendanceClass()}
function homePage(){let today=db.attendance.filter(x=>x.date===dateNow());let recent=db.lessons.slice().sort((a,b)=>(b.created||'').localeCompare(a.created||'')).slice(0,4);return pageHead('مساحة العمل','مرحباً، '+esc(db.teacher||'أستاذنا')+'','ابدأ يومك بتنظيم القسم وصناعة تجربة تعلم أكثر فاعلية.',btn('＋ تحضير درس',"openLesson()"))+
'<section class="hero"><div class="hero-copy"><div class="hero-kicker">مِداد — أدواتك، أفكارك، وأثرُك</div><h2>حوّل أفكارك التعليمية<br>إلى موارد جاهزة للتعلّم.</h2><p>خطّط دروسك، أنشئ أنشطة، تابع تلاميذك، واجمع أعمالك في مساحة واحدة مرتبة.</p><div class="hero-actions">'+btn('إنشاء قسم',"openClass()")+' '+btn('إضافة تلميذ',"openStudent()",'secondary')+'</div></div><div class="hero-art"><div class="paper-stack"><span></span><span></span><span>مِداد</span></div></div></section>'+
'<section class="stats"><div class="stat"><div class="stat-icon">▦</div><div><strong>'+count(db.classes)+'</strong><small>الأقسام المسجلة</small></div></div><div class="stat"><div class="stat-icon">♙</div><div><strong>'+count(db.students)+'</strong><small>التلاميذ</small></div></div><div class="stat"><div class="stat-icon">▤</div><div><strong>'+count(db.lessons)+'</strong><small>الدروس المحضّرة</small></div></div><div class="stat"><div class="stat-icon">✓</div><div><strong>'+count(today)+'</strong><small>سجلات حضور اليوم</small></div></div></section>'+
'<section class="grid-two"><div class="card"><div class="section-title"><div><h3>ابدأ عملاً جديداً</h3><p>اختصارات لأكثر المهام استخداماً</p></div></div><div class="quick-grid"><button class="quick" onclick="openLesson()"><div class="qico">▤</div><b>تحضير درس</b><small>اكتب الأهداف والشرح وارسم</small></button><button class="quick" onclick="openActivity()"><div class="qico">◇</div><b>نشاط تفاعلي</b><small>أنشئ نشاطاً للمراجعة</small></button><button class="quick" onclick="openAssessment()"><div class="qico">▧</div><b>تقويم قصير</b><small>جهّز أسئلة التقييم</small></button><button class="quick" onclick="navigate(\'attendance\')"><div class="qico">✓</div><b>تسجيل الحضور</b><small>تابع حضور تلاميذك</small></button></div></div><div class="card"><div class="section-title"><div><h3>آخر الدروس</h3><p>أحدث ما أضفته إلى مكتبتك</p></div><button class="text-link" onclick="navigate(\'lessons\')">عرض الكل ←</button></div>'+(recent.length?'<div class="list">'+recent.map(x=>'<div class="list-row"><div class="list-main"><div class="mini-icon">▤</div><div><b>'+esc(x.title)+'</b><small>'+esc(x.subject||'دون مادة')+' · '+dateLabel(x.created)+'</small></div></div><button class="text-link" onclick="viewLesson(\''+x.id+'\')">فتح</button></div>').join('')+'</div>':empty('لم تحضّر أي درس بعد','ابدأ بإنشاء أول درس ليظهر هنا.',btn('تحضير أول درس',"openLesson()",'secondary')) )+'</div></section><div class="footer-note">مِداد — مساحة عمل تعليمية مستقلة</div>'}
function classesPage(){return pageHead('إدارة القسم','الأقسام التعليمية','أنشئ أقسامك ونظّم قوائم التلاميذ حسب المستوى.',btn('＋ إنشاء قسم',"openClass()"))+'<div class="toolbar"><input class="field-search" id="classFilter" placeholder="ابحث عن قسم..." oninput="filterCards(\'classCards\',this.value)"></div><div class="cards" id="classCards">'+(db.classes.length?db.classes.map(c=>'<article class="item-card" data-search="'+esc((c.name+' '+c.level+' '+c.year).toLowerCase())+'"><div class="item-top"><div class="item-symbol">▦</div><span class="pill">'+esc(c.level||'قسم')+'</span></div><h3>'+esc(c.name)+'</h3><p>'+esc(c.year||db.year)+' · '+esc(c.stage||'')+'</p><div class="item-meta"><span class="pill green">'+count(db.students.filter(s=>s.classId===c.id))+' تلميذ</span><span class="pill">'+esc(c.capacity||'—')+' مقعد متوقع</span></div><div class="item-actions">'+btn('قائمة التلاميذ',"classStudents('"+c.id+"')",'light small')+btn('تعديل',"editClass('"+c.id+"')",'secondary small')+btn('حذف',"deleteItem('classes','"+c.id+"')",'danger small')+'</div></article>').join(''):empty('لا توجد أقسام بعد','أنشئ قسماً لتبدأ في تسجيل التلاميذ وتنظيم الدروس.',btn('إنشاء أول قسم',"openClass()")) )+'</div>'}
function studentsPage(){return pageHead('إدارة القسم','التلاميذ','سجّل بيانات التلاميذ واربط كل تلميذ بقسمه.',btn('＋ إضافة تلميذ',"openStudent()"))+'<div class="toolbar"><input class="field-search" id="studentFilter" placeholder="ابحث بالاسم..." oninput="filterRows(this.value)"><select class="filter" id="studentClassFilter" onchange="filterRows(document.getElementById(\'studentFilter\').value)"><option value="">كل الأقسام</option>'+db.classes.map(c=>'<option value="'+c.id+'">'+esc(c.name)+'</option>').join('')+'</select></div><div class="table-wrap"><table><thead><tr><th>التلميذ</th><th>القسم</th><th>رقم/معرّف</th><th>ملاحظات</th><th>إجراء</th></tr></thead><tbody id="studentRows">'+(db.students.length?db.students.map(s=>studentRow(s)).join(''):'<tr><td colspan="5">'+empty('لا يوجد تلاميذ مسجلون','أضف التلاميذ يدوياً أو أنشئ قسماً أولاً.',btn('إضافة تلميذ',"openStudent()",'secondary'))+'</td></tr>')+'</tbody></table></div>'}
function studentRow(s){let c=db.classes.find(x=>x.id===s.classId);return '<tr data-search="'+esc((s.name+' '+(c?c.name:'')+' '+s.number).toLowerCase())+'" data-class="'+esc(s.classId||'')+'"><td class="student-name">'+esc(s.name)+'</td><td>'+esc(c?c.name:'غير محدد')+'</td><td>'+esc(s.number||'—')+'</td><td>'+esc(s.notes||'—')+'</td><td><button class="text-link" onclick="editStudent(\''+s.id+'\')">تعديل</button> <button class="text-link" style="color:#a35f57" onclick="deleteItem(\'students\',\''+s.id+'\')">حذف</button></td></tr>'}
function attendancePage(){let cls=db.classes[0]?.id||'';return pageHead('متابعة التلاميذ','الحضور والغياب','سجّل حالة التلاميذ لكل يوم واحتفظ بسجل قابل للمراجعة.')+'<div class="card"><div class="toolbar"><select class="filter" id="attClass" onchange="fillAttendanceClass()"><option value="">اختر القسم</option>'+db.classes.map(c=>'<option value="'+c.id+'">'+esc(c.name)+'</option>').join('')+'</select><input class="filter" type="date" id="attDate" value="'+dateNow()+'"><button class="btn primary" onclick="saveAttendance()">حفظ سجل اليوم</button></div><div id="attendanceList">'+(db.classes.length?'اختر القسم لعرض القائمة.':empty('أنشئ قسماً أولاً','تحتاج إلى قسم وتلاميذ قبل تسجيل الحضور.'))+'</div></div><div class="card" style="margin-top:16px"><div class="section-title"><h3>السجلات السابقة</h3><span class="pill">'+count(db.attendance)+' سجل</span></div><div class="table-wrap"><table><thead><tr><th>التاريخ</th><th>التلميذ</th><th>القسم</th><th>الحالة</th></tr></thead><tbody>'+(db.attendance.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,30).map(a=>{let s=db.students.find(x=>x.id===a.studentId),c=db.classes.find(x=>x.id===a.classId);return '<tr><td>'+dateLabel(a.date)+'</td><td>'+esc(s?s.name:'تلميذ محذوف')+'</td><td>'+esc(c?c.name:'—')+'</td><td><span class="status '+(a.status==='غائب'?'absent':'')+'">'+esc(a.status)+'</span></td></tr>'}).join('')||'<tr><td colspan="4" class="muted">لا توجد سجلات سابقة.</td></tr>')+'</tbody></table></div></div>'}
function fillAttendanceClass(){let sel=document.getElementById('attClass');if(!sel)return;let cid=sel.value;let date=document.getElementById('attDate')?.value||dateNow();let list=document.getElementById('attendanceList');if(!cid){list.innerHTML='اختر القسم لعرض القائمة.';return}let students=db.students.filter(s=>s.classId===cid);if(!students.length){list.innerHTML=empty('لا يوجد تلاميذ في هذا القسم','أضف التلاميذ أولاً من صفحة التلاميذ.');return}list.innerHTML='<div class="table-wrap"><table><thead><tr><th>التلميذ</th><th>حاضر</th><th>غائب</th><th>متأخر</th></tr></thead><tbody>'+students.map(s=>{let old=db.attendance.find(a=>a.studentId===s.id&&a.date===date);let v=old?old.status:'حاضر';return '<tr><td class="student-name">'+esc(s.name)+'</td><td><input type="radio" name="att_'+s.id+'" value="حاضر" '+(v==='حاضر'?'checked':'')+'></td><td><input type="radio" name="att_'+s.id+'" value="غائب" '+(v==='غائب'?'checked':'')+'></td><td><input type="radio" name="att_'+s.id+'" value="متأخر" '+(v==='متأخر'?'checked':'')+'></td></tr>'}).join('')+'</tbody></table></div>'}
function saveAttendance(){let cid=document.getElementById('attClass')?.value,date=document.getElementById('attDate')?.value||dateNow();if(!cid){toast('اختر القسم أولاً');return}db.attendance=db.attendance.filter(a=>!(a.classId===cid&&a.date===date));db.students.filter(s=>s.classId===cid).forEach(s=>{let checked=document.querySelector('input[name="att_'+s.id+'"]:checked');db.attendance.push({id:id(),classId:cid,studentId:s.id,date,status:checked?checked.value:'حاضر'})});save();render();toast('تم حفظ سجل الحضور')}

let alphabetIndex=0,alphabetAuto=false,alphabetTimer=null;
function alphabetSongStage(){
 const item=alphabetSong[alphabetIndex],pct=((alphabetIndex+1)/alphabetSong.length)*100;
 return '<div class="alphabet-song"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px"><b>أنشودة حروفي الجميلة</b><span class="pill">'+(alphabetIndex+1)+' / '+alphabetSong.length+'</span></div><div class="song-stage"><div class="song-letter" id="alphabetLetter">'+item[0]+'</div><div class="song-line" id="alphabetLine">'+item[1]+'</div><span class="song-word" id="alphabetWord">كلمة: '+item[2]+'</span></div><div class="song-progress"><span id="alphabetProgress" style="width:'+pct+'%"></span></div><div style="text-align:center;font-size:12px;color:#79513d" id="alphabetCounter">الحرف '+(alphabetIndex+1)+' من '+alphabetSong.length+'</div><div class="song-controls"><button type="button" onclick="alphabetPrev()">السابق</button><button type="button" class="primary-song" id="alphabetPlay" onclick="alphabetSpeak()">استمع إلى البيت</button><button type="button" onclick="alphabetNext()">التالي</button><button type="button" onclick="alphabetToggleAuto()" id="alphabetAutoBtn">عرض متتابع</button></div><div class="song-note">يمكنك الاستماع إلى نطق البيت بصوت عربي آلي إذا كان جهازك يدعم ذلك. هذا نطق إرشادي وليس تسجيلاً غنائياً.</div></div>';
}
function openAlphabetSong(){
 alphabetStop();alphabetIndex=0;
 const video='<div class="alphabet-song-video"><iframe src="https://www.youtube-nocookie.com/embed/Tx_yoMRDDqc?rel=0" title="أنشودة الحروف - ألف أرنب يجري يلعب - Tam Tam TV" loading="lazy" referrerpolicy="strict-origin-when-cross-origin" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe></div><p class="alphabet-source">الفيديو من قناة Tam Tam TV على YouTube. شغّل الفيديو من داخل المشغّل لمشاهدة الأنشودة المغنّاة.</p>';
 openModal('أنشودة الحروف الأبجدية','الفيديو المغنّى مع نشاط تفاعلي لمراجعة الحروف',video+alphabetSongStage(),true);
}
function alphabetUpdate(){
 const item=alphabetSong[alphabetIndex],letter=document.getElementById('alphabetLetter');
 if(!letter)return;
 letter.textContent=item[0];letter.style.animation='none';void letter.offsetWidth;letter.style.animation='';
 document.getElementById('alphabetLine').textContent=item[1];
 document.getElementById('alphabetWord').textContent='كلمة: '+item[2];
 document.getElementById('alphabetProgress').style.width=((alphabetIndex+1)/alphabetSong.length*100)+'%';
 document.getElementById('alphabetCounter').textContent='الحرف '+(alphabetIndex+1)+' من '+alphabetSong.length;
}
function alphabetNext(){if(alphabetIndex<alphabetSong.length-1){alphabetIndex++;alphabetUpdate()}else{alphabetStop();toast('أحسنت! أكملت الحروف الأبجدية.')}}
function alphabetPrev(){if(alphabetIndex>0){alphabetIndex--;alphabetUpdate()}}
function alphabetSpeak(){
 if(!('speechSynthesis' in window)){toast('ميزة النطق غير متاحة في هذا المتصفح');return}
 speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(alphabetSong[alphabetIndex][1]);
 u.lang='ar-SA';u.rate=.82;u.pitch=1.08;
 u.onend=()=>{if(alphabetAuto){if(alphabetIndex<alphabetSong.length-1){alphabetIndex++;alphabetUpdate();alphabetSpeak()}else{alphabetStop();toast('انتهت الأنشودة التعليمية.')}}};
 speechSynthesis.speak(u);
}
function alphabetToggleAuto(){
 alphabetAuto=!alphabetAuto;
 const b=document.getElementById('alphabetAutoBtn');if(b)b.textContent=alphabetAuto?'إيقاف العرض المتتابع':'عرض متتابع';
 if(alphabetAuto)alphabetSpeak();else if('speechSynthesis' in window)speechSynthesis.cancel();
}
function alphabetStop(){alphabetAuto=false;if('speechSynthesis' in window)speechSynthesis.cancel();if(alphabetTimer)clearInterval(alphabetTimer);alphabetTimer=null}

>تراجع</button><button type="button" class="tool" onclick="clearBoard()">مسح اللوحة</button></div><button type="button" class="tool" onclick="downloadBoard()">تنزيل الرسم</button></div><canvas id="lessonBoard"></canvas></div><aside class="board-side"><h4>أدوات الرسم</h4><label style="font-size:11px">لون القلم</label><input type="color" id="boardColor" value="'+esc(l.color||'#563829')+'" onchange="boardColor=this.value"><label style="font-size:11px">سُمك القلم</label><input type="range" min="1" max="18" value="4" id="boardSize" oninput="boardSize=+this.value"><p>يمكنك الرسم باللمس على الهاتف أو باستخدام الفأرة. استخدم التراجع لإلغاء آخر خطوة.</p><button type="button" class="btn light small" onclick="downloadBoard()">حفظ الرسم كصورة</button></aside></div><input type="hidden" name="drawing" id="drawingField"></form><div class="modal-actions"><button class="btn primary" onclick="submitLesson()">حفظ الدرس</button><button class="btn light" onclick="closeModal()">إلغاء</button></div>',true);setupBoard(l.drawing)}
function setupBoard(saved){board=document.getElementById('lessonBoard');if(!board)return;boardCtx=board.getContext('2d');boardHistory=[];let resize=()=>{let old=document.createElement('canvas');old.width=board.width;old.height=board.height;if(board.width&&board.height)old.getContext('2d').drawImage(board,0,0);let rect=board.getBoundingClientRect();let dpr=Math.min(window.devicePixelRatio||1,2);board.width=rect.width*dpr;board.height=rect.height*dpr;boardCtx=board.getContext('2d');boardCtx.scale(dpr,dpr);boardCtx.lineCap='round';boardCtx.lineJoin='round';if(saved){let im=new Image();im.onload=()=>boardCtx.drawImage(im,0,0,rect.width,rect.height);im.src=saved;saved=null}else if(old.width){boardCtx.drawImage(old,0,0,old.width,old.height,0,0,rect.width,rect.height)}};resize();board._resize=resize;let pos=e=>{let r=board.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}};board.onpointerdown=e=>{e.preventDefault();boardDrawing=true;board.setPointerCapture(e.pointerId);boardHistory.push(board.toDataURL());if(boardHistory.length>25)boardHistory.shift();let p=pos(e);boardCtx.beginPath();boardCtx.moveTo(p.x,p.y);boardCtx.strokeStyle=boardTool==='erase'?'#ffffff':boardColor;boardCtx.lineWidth=boardTool==='erase'?boardSize*4:boardSize};board.onpointermove=e=>{if(!boardDrawing)return;let p=pos(e);boardCtx.lineTo(p.x,p.y);boardCtx.stroke()};board.onpointerup=()=>boardDrawing=false;board.onpointercancel=()=>boardDrawing=false;window.addEventListener('resize',()=>{if(document.getElementById('lessonBoard')&&board===document.getElementById('lessonBoard'))board._resize()},{passive:true})}
function setBoardTool(t){boardTool=t;document.getElementById('penTool')?.classList.toggle('active',t==='pen');document.getElementById('eraseTool')?.classList.toggle('active',t==='erase')}
function undoBoard(){if(!board||!boardHistory.length)return;let src=boardHistory.pop(),im=new Image();im.onload=()=>{let r=board.getBoundingClientRect();boardCtx.clearRect(0,0,r.width,r.height);boardCtx.drawImage(im,0,0,r.width,r.height)};im.src=src}
function clearBoard(){if(!board||!confirm('مسح محتوى اللوحة؟'))return;boardHistory.push(board.toDataURL());let r=board.getBoundingClientRect();boardCtx.clearRect(0,0,r.width,r.height)}

async function generateTeachingResource(kind){
 const title=document.getElementById('aiLessonTitle')?.value.trim();
 const subject=document.getElementById('aiSubject')?.value.trim()||'';
 const level=document.getElementById('aiLevel')?.value.trim()||'';
 const type=document.getElementById('aiActivityType')?.value||'متنوع';
 const difficulty=document.getElementById('aiDifficulty')?.value||'سهل';
 if(!title){toast('اكتب عنوان الدرس أولاً');return}
 if(!db.aiEndpoint){toast('أضف رابط Gemini الآمن من صفحة الإعدادات أولاً');navigate('settings');return}
 const buttons=document.querySelectorAll('button[onclick*="generateTeachingResource"]');
 buttons.forEach(b=>{b.disabled=true;b.dataset.oldText=b.textContent;b.textContent='جارٍ التوليد...'});
 try{
  const response=await fetch(db.aiEndpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({kind,lessonTitle:title,subject,level,difficulty,activityType:type})});
  const payload=await response.json();
  if(!response.ok)throw new Error(payload.error||'تعذر الاتصال بخدمة Gemini');
  const data=payload.result||payload;
  if(kind==='activity'){
   if(!Array.isArray(data.items)||!data.items.length)throw new Error('لم يُرجع الذكاء الاصطناعي عناصر نشاط صالحة');
   db.activities.push({id:id(),title:data.title||('نشاط: '+title),subject:subject||data.subject||'',level:level||data.level||'',type:data.type||type,items:data.items.map(x=>({q:String(x.q||''),a:String(x.a||'')})).filter(x=>x.q)});
   save();render();toast('تم توليد النشاط وحفظه');
  }else{
   if(!Array.isArray(data.questions)||!data.questions.length)throw new Error('لم يُرجع الذكاء الاصطناعي أسئلة تقويم صالحة');
   db.assessments.push({id:id(),title:data.title||('تقويم قصير: '+title),subject:subject||data.subject||'',level:level||data.level||'',kind:'تقويم قصير',duration:data.duration||10,questions:data.questions.map(x=>({q:String(x.q||''),a:String(x.a||'')})).filter(x=>x.q)});
   save();navigate('assessments');toast('تم إنشاء التقويم القصير وحفظه');
  }
 }catch(err){toast(err.message||'حدث خطأ أثناء التوليد')}
 finally{buttons.forEach(b=>{b.disabled=false;b.textContent=b.dataset.oldText||b.textContent})}
}

function saveActivity(e,edit){e.preventDefault();let v=Object.fromEntries(new FormData(e.target).entries());v.items=v.itemsText.split('\\n').map(x=>x.split('|')).filter(x=>x[0]?.trim()).map(x=>({q:x[0].trim(),a:(x[1]||'').trim()}));delete v.itemsText;if(edit)Object.assign(db.activities.find(x=>x.id===edit),v);else db.activities.push({id:id(),...v});save();closeModal();render();toast('تم حفظ النشاط')}
function editActivity(x){openActivity(x)}
function viewActivity(x){let a=db.activities.find(v=>v.id===x);if(!a)return;openModal(esc(a.title),'بطاقات النشاط — '+esc(a.type),'<div class="cards" style="grid-template-columns:repeat(2,minmax(0,1fr))">'+(a.items||[]).map((it,i)=>'<div class="item-card"><span class="pill">بطاقة '+(i+1)+'</span><h3>'+esc(it.q)+'</h3><p>الإجابة: '+esc(it.a||'لم تُحدّد')+'</p></div>').join('')+'</div><div class="modal-actions">'+btn('طباعة',"window.print()")+' '+btn('إغلاق','closeModal()','light')+'</div>',true)}
function openAssessment(edit){let a=edit?db.assessments.find(x=>x.id===edit):{};openModal(edit?'تعديل التقويم':'إعداد تقويم أو اختبار','أضف الأسئلة والإجابات النموذجية ثم احفظها للطباعة.', '<form onsubmit="saveAssessment(event,\''+(edit||'')+'\')"><div class="form-grid">'+formField('عنوان التقويم','title',a.title,'text','required')+formField('المادة','subject',a.subject)+formField('المستوى','level',a.level)+'<div class="form-field"><label>النوع</label><select name="kind"><option>تقويم تشخيصي</option><option>تقويم تكويني</option><option>اختبار قصير</option><option>واجب منزلي</option></select></div>'+formField('المدة بالدقائق','duration',a.duration,'number')+'<div class="form-field full"><label>الأسئلة — سؤال في كل سطر، ويمكن وضع الإجابة بعد |</label><textarea name="questionsText" style="min-height:170px" placeholder="السؤال الأول | الإجابة النموذجية&#10;السؤال الثاني | الإجابة النموذجية">'+esc((a.questions||[]).map(q=>q.q+' | '+q.a).join('\\n'))+'</textarea></div></div><div class="modal-actions"><button class="btn primary">حفظ التقويم</button><button type="button" class="btn light" onclick="closeModal()">إلغاء</button></div></form>')}

function openResource(edit){let r=edit?db.resources.find(x=>x.id===edit):{};openModal(edit?'تعديل المورد':'إضافة مورد إلى المكتبة','احفظ مرجعاً أو رابطاً للعودة إليه لاحقاً.','<form onsubmit="saveResource(event,\''+(edit||'')+'\')"><div class="form-grid">'+formField('عنوان المورد','title',r.title,'text','required')+'<div class="form-field"><label>نوع المورد</label><select name="kind"><option>رابط تعليمي</option><option>مرجع</option><option>فكرة نشاط</option><option>ملاحظة</option><option>أخرى</option></select></div><div class="form-field full"><label>الرابط (اختياري)</label><input type="url" name="url" value="'+esc(r.url||'')+'" placeholder="https://..."></div><div class="form-field full"><label>ملاحظات</label><textarea name="note">'+esc(r.note||'')+'</textarea></div></div><div class="modal-actions"><button class="btn primary">حفظ المورد</button><button type="button" class="btn light" onclick="closeModal()">إلغاء</button></div></form>')}

function saveSettings(e){e.preventDefault();let v=Object.fromEntries(new FormData(e.target).entries());Object.assign(db,v);save();render();toast('تم تحديث الإعدادات')}
function exportData(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='midad-backup-'+dateNow()+'.json';a.click();URL.revokeObjectURL(a.href);toast('تم تجهيز النسخة الاحتياطية')}
function importData(e){let file=e.target.files[0];if(!file)return;let reader=new FileReader();reader.onload=()=>{try{let v=JSON.parse(reader.result);if(!v||typeof v!=='object'||!Array.isArray(v.classes)||!Array.isArray(v.students))throw new Error();db=Object.assign({},defaults,v);save();render();toast('تم استيراد البيانات بنجاح')}catch(err){toast('الملف غير صالح أو ليس نسخة مِداد')}};reader.readAsText(file)}
function confirmReset(){if(!confirm('سيتم حذف جميع بيانات مِداد من هذا المتصفح. هل أنشأت نسخة احتياطية؟'))return;if(!confirm('تأكيد أخير: حذف جميع الأقسام والتلاميذ والدروس؟'))return;db={...defaults};save();render();toast('تمت إعادة تهيئة المساحة')}
