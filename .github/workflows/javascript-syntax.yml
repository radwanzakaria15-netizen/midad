name: JavaScript syntax checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Syntax-check standalone JavaScript files
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' scripts < <(find . -type f -name '*.js' -not -path './node_modules/*' -not -path './.git/*' -print0)
          if [ "${#scripts[@]}" -eq 0 ]; then
            echo "No JavaScript files found." >&2
            exit 1
          fi
          for file in "${scripts[@]}"; do
            echo "Checking $file"
            node --input-type=module --check < "$file"
          done
      - name: Syntax-check inline JavaScript in index.html
        shell: bash
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          import subprocess, sys
          class InlineScripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.active = None
                  self.buffer = []
                  self.scripts = []
              def handle_starttag(self, tag, attrs):
                  if tag == "script":
                      values = dict(attrs)
                      if not values.get("src"):
                          self.active = values.get("type", "text/javascript").split(";", 1)[0].strip().lower()
                          self.buffer = []
              def handle_data(self, data):
                  if self.active is not None:
                      self.buffer.append(data)
              def handle_endtag(self, tag):
                  if tag == "script" and self.active is not None:
                      if self.active in ("", "text/javascript", "application/javascript", "module", "text/ecmascript", "application/ecmascript"):
                          self.scripts.append("".join(self.buffer))
                      self.active = None
                      self.buffer = []
          parser = InlineScripts()
          with open("index.html", encoding="utf-8") as source:
              parser.feed(source.read())
          for number, script in enumerate(parser.scripts, 1):
              result = subprocess.run(["node", "--input-type=module", "--check"], input=script, text=True, capture_output=True)
              if result.returncode:
                  print(f"Inline script #{number} failed syntax check:", file=sys.stderr)
                  print(result.stderr, file=sys.stderr)
                  sys.exit(result.returncode)
          print(f"Checked {len(parser.scripts)} inline JavaScript blocks.")
          PY
