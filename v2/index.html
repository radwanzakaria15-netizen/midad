<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#6256d9"><title>مِداد | مساحة الأستاذ لصناعة التعلّم</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--p:#6256d9;--navy:#283b67;--teal:#23b6a4;--bg:#f6f7fb;--s:#fff;--t:#20243a;--m:#858ba3;--l:#e9eaf2;--soft:#f0efff;font-family:"IBM Plex Sans Arabic",sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:inherit}button,input,select,textarea{font:inherit}button{cursor:pointer}.layout{min-height:100vh}.side{position:fixed;inset:0 0 0 auto;width:250px;background:#fff;border-left:1px solid var(--l);padding:22px 15px;display:flex;flex-direction:column;z-index:5}.brand{display:flex;align-items:center;gap:11px;padding:5px 7px 26px}.mark{width:45px;height:45px;border-radius:15px;background:linear-gradient(145deg,var(--p),#8278ed);color:white;display:grid;place-items:center;font-size:25px;font-weight:700}.brand b{font-size:22px}.brand small{display:block;color:var(--m);font-size:10px}.caption{font-size:10px;color:#a0a4b7;padding:8px 12px}.nav button{width:100%;height:43px;border:0;background:transparent;border-radius:11px;text-align:right;padding:0 13px;color:#666c84;font-size:13px;margin:2px 0}.nav button.active,.nav button:hover{background:var(--soft);color:var(--p);font-weight:700}.nav button span{display:inline-block;width:28px;font-size:17px}.sidefoot{margin-top:auto;font-size:10px;color:var(--m);padding:12px}.main{margin-right:250px;min-height:100vh;display:flex;flex-direction:column}.top{height:72px;background:#ffffffed;border-bottom:1px solid var(--l);display:flex;align-items:center;justify-content:space-between;padding:0 32px;position:sticky;top:0;z-index:3}.crumb{font-size:12px;color:var(--m)}.tools{display:flex;gap:10px;align-items:center}.search{width:240px;height:38px;border:1px solid var(--l);border-radius:10px;padding:0 12px;background:#fafbfe}.icon{height:38px;width:38px;border:1px solid var(--l);border-radius:10px;background:#fff;color:#777}.view{width:min(1400px,100%);margin:auto;padding:30px 32px;flex:1}.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:22px}.eyebrow{font-size:10px;color:var(--p);font-weight:700}.head h1{font-size:26px;margin:5px 0}.head p{font-size:12px;color:var(--m);margin:0}.btn{border:0;border-radius:10px;padding:10px 15px;font-size:12px;font-weight:700}.primary{background:var(--p);color:white}.quiet{background:#f0f1f8;color:#69708b}.hero{background:linear-gradient(110deg,#292f58,#3e4c81);border-radius:21px;padding:27px 30px;color:#fff;margin-bottom:18px;display:flex;justify-content:space-between;align-items:center}.hero h2{font-size:23px;margin:8px 0}.hero p{font-size:12px;color:#d4d8eb;margin:0}.hero .eyebrow{color:#c2bdff}.hero-art{font-size:46px;color:#c1bcff}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.stat,.panel,.item{background:var(--s);border:1px solid var(--l);border-radius:16px;box-shadow:0 10px 28px #22274b0a}.stat{padding:16px;display:flex;align-items:center;gap:12px}.stat i{font-style:normal;width:40px;height:40px;border-radius:12px;background:#efeeff;color:var(--p);display:grid;place-items:center;font-size:19px}.stat strong{font-size:22px;display:block}.stat small{font-size:10px;color:var(--m)}.columns{display:grid;grid-template-columns:1.15fr .85fr;gap:15px}.panel{padding:18px;margin-bottom:15px}.panel h3{font-size:14px;margin:0 0 14px}.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}.quick button{border:1px solid var(--l);border-radius:12px;padding:13px;background:white;text-align:right;color:var(--t);font-size:12px}.quick button:hover{border-color:#bcb6ff;background:#fbfaff}.quick small{display:block;color:var(--m);font-size:10px}.toolbar{display:flex;gap:9px;align-items:center;margin-bottom:14px;flex-wrap:wrap}.field{height:39px;border:1px solid var(--l);border-radius:10px;padding:0 11px;background:white;font-size:11px}.tablewrap{overflow:auto;border:1px solid var(--l);border-radius:13px;background:white}table{width:100%;border-collapse:collapse;min-width:550px}th,td{text-align:right;padding:12px;border-bottom:1px solid #eff0f5;font-size:11px}th{background:#fafaff;color:#737993}td{color:#555b73}.tag{padding:4px 8px;background:#eff8f5;color:#168d7c;border-radius:20px;font-size:9px}.actions{display:flex;gap:5px}.tiny{border:1px solid var(--l);background:white;border-radius:7px;padding:5px 8px;font-size:10px}.del{color:#c45f67}.empty{text-align:center;border:1px dashed #dfe1eb;border-radius:13px;padding:30px 15px;color:var(--m);font-size:11px;line-height:2}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.item{padding:16px}.item h3{font-size:13px}.item p{font-size:10px;color:var(--m);line-height:1.8}.modalbg{display:none;position:fixed;inset:0;background:#161a2d80;z-index:9;align-items:center;justify-content:center;padding:15px}.modalbg.show{display:flex}.modal{background:white;border-radius:18px;width:min(600px,100%);padding:22px;max-height:90vh;overflow:auto}.modal h2{font-size:18px;margin:0 0 18px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.f{display:grid;gap:6px}.f.full{grid-column:1/-1}.f label{font-size:10px;font-weight:700}.f input,.f select,.f textarea{width:100%;border:1px solid var(--l);border-radius:9px;padding:10px;font-size:11px}.f textarea{min-height:75px}.modalactions{display:flex;gap:8px;margin-top:18px}.toast{position:fixed;bottom:20px;left:20px;background:#242a47;color:white;padding:12px 16px;border-radius:10px;font-size:11px;display:none;z-index:12}.toast.show{display:block}.foot{border-top:1px solid var(--l);padding:15px 32px;font-size:10px;color:#989db0}.menu{display:none}body.dark{--bg:#171a28;--s:#222638;--t:#edf0fb;--m:#a1a8c0;--l:#343a52;--soft:#302d53}body.dark .side,body.dark .top,body.dark .panel,body.dark .stat,body.dark .item,body.dark .modal,body.dark .tablewrap,body.dark .field,body.dark .quick button{background:var(--s);color:var(--t)}body.dark th{background:#292e43}body.dark td{color:#d0d5e7}@media(max-width:950px){.side{width:215px}.main{margin-right:215px}.view{padding:24px 20px}.stats{grid-template-columns:repeat(2,1fr)}.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){.side{width:270px;transform:translateX(105%);transition:.2s;box-shadow:-10px 0 30px #0001}.side.open{transform:none}.main{margin:0}.top{height:62px;padding:0 12px;gap:8px}.menu{display:block}.search{width:38px;padding:0;border:0;background:transparent}.search::placeholder{color:transparent}.tools{gap:6px}.view{padding:20px 13px}.columns{grid-template-columns:1fr}.hero{padding:20px}.hero-art{display:none}.hero h2{font-size:19px}.cards{grid-template-columns:1fr}.head{align-items:flex-start;flex-direction:column}.head>.btn{width:100%}.foot{padding:13px}.fields{grid-template-columns:1fr}.f.full{grid-column:auto}}@media(max-width:400px){.stats{gap:7px}.stat{padding:11px;gap:8px}.stat i{width:32px;height:32px}.stat strong{font-size:19px}}
</style></head><body><div class="layout">
<aside class="side" id="side"><div class="brand"><span class="mark">م</span><span><b>مِداد</b><small>مساحة الأستاذ لصناعة التعلّم</small></span></div><div class="caption">مساحة العمل</div><nav class="nav" id="nav"><button class="active" data-page="home"><span>⌂</span>الرئيسية</button><button data-page="classes"><span>▦</span>فضاء القسم</button><button data-page="students"><span>♙</span>التلاميذ</button><button data-page="attendance"><span>◷</span>الحضور والغياب</button><button data-page="lessons"><span>▤</span>التحضير والدروس</button><button data-page="activities"><span>✎</span>الأنشطة والتمارين</button><button data-page="assessments"><span>◈</span>التقويم</button><button data-page="resources"><span>▧</span>مكتبة الموارد</button><button data-page="reports"><span>▥</span>التقارير</button><button data-page="assistant"><span>✧</span>مساعد مِداد</button></nav><div class="sidefoot"><button class="navlink" data-page="settings">⚙ الإعدادات</button><p>نسخة تأسيسية · حفظ محلي على هذا الجهاز</p></div></aside>
<div class="main"><header class="top"><button class="icon menu" id="menu">☰</button><div class="crumb">مِداد　/　<strong id="crumb">الرئيسية</strong></div><div class="tools"><input class="search" id="search" placeholder="بحث..."><button class="icon" id="theme">◐</button><button class="icon" id="profile">أ</button></div></header><main class="view" id="view"></main><footer class="foot">مِداد · مساحة الأستاذ لصناعة التعلّم <span style="float:left">الإصدار التأسيسي 2.0</span></footer></div></div>
<div class="modalbg" id="modalbg"><section class="modal"><h2 id="mtitle">إضافة عنصر</h2><form id="form"><div class="fields" id="fields"></div><div class="modalactions"><button type="button" class="btn quiet" id="cancel">إلغاء</button><button class="btn primary">حفظ</button></div></form></section></div><div class="toast" id="toast"></div>
<script>
(function(){
const KEY="midad_v2_data",empty={teacher:"الأستاذ",classes:[],students:[],attendance:[],lessons:[],activities:[],assessments:[],resources:[]};
let data;try{data=Object.assign({},empty,JSON.parse(localStorage.getItem(KEY)||"{}"))}catch(e){data=Object.assign({},empty)}
let page="home",type=null,editing=null;
const $=s=>document.querySelector(s),safe=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const titles={home:["الرئيسية","نظرة عامة على مساحة عملك التعليمية"],classes:["فضاء القسم","نظّم أقسامك ومستوياتك الدراسية"],students:["التلاميذ","ملفات التلاميذ وبياناتهم الأساسية"],attendance:["الحضور والغياب","سجّل الحضور وتابع المواظبة اليومية"],lessons:["التحضير والدروس","أنشئ تحضيراتك البيداغوجية واحفظها"],activities:["الأنشطة والتمارين","صمّم أنشطة تعليمية متنوعة"],assessments:["التقويم","تابع نتائج التعلّم ومؤشرات التقدّم"],resources:["مكتبة الموارد","اجمع مواردك التعليمية في مكان واحد"],reports:["التقارير","ملخصات وإحصائيات مساحة عملك"],assistant:["مساعد مِداد","مساحة المساعدة التربوية"],settings:["الإعدادات","خصّص مساحة عملك"]};
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function notify(s){let t=$("#toast");t.textContent=s;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2300)}
function button(s,t){return '<button class="btn primary" data-add="'+t+'">＋ '+s+'</button>'}
function header(p,action){return '<div class="head"><div><span class="eyebrow">مِداد / مساحة الأستاذ</span><h1>'+titles[p][0]+'</h1><p>'+titles[p][1]+'</p></div>'+(action||"")+'</div>'}
function emptybox(a,b){return '<div class="empty"><b>'+a+'</b><br>'+b+'</div>'}
function panel(title,body){return '<section class="panel"><h3>'+title+'</h3>'+body+'</section>'}
function rows(h,r){return '<div class="tablewrap"><table><thead><tr>'+h.map(x=>'<th>'+x+'</th>').join("")+'</tr></thead><tbody>'+r+'</tbody></table></div>'}
function actions(id){return '<div class="actions"><button class="tiny" data-edit="'+id+'">تعديل</button><button class="tiny del" data-del="'+id+'">حذف</button></div>'}
function home(){let today=new Date().toISOString().slice(0,10),present=data.attendance.filter(x=>x.date===today&&x.status==="حاضر").length;return header("home",button("إضافة تلميذ","student"))+'<section class="hero"><div><span class="eyebrow">مساحتك التعليمية</span><h2>مساحة هادئة لأفكار كبيرة.</h2><p>خطّط لدروسك، تابع تلاميذك، واصنع تجارب تعلّم أكثر تنظيماً.</p><br><button class="btn" style="background:white;color:#343b6b" data-page="lessons">ابدأ بتحضير درس ←</button></div><div class="hero-art">مِداد ✧</div></section><div class="stats"><div class="stat"><i>♙</i><div><strong>'+data.students.length+'</strong><small>إجمالي التلاميذ</small></div></div><div class="stat"><i>▦</i><div><strong>'+data.classes.length+'</strong><small>الأقسام المسجلة</small></div></div><div class="stat"><i>◷</i><div><strong>'+present+'</strong><small>حاضر اليوم</small></div></div><div class="stat"><i>▤</i><div><strong>'+data.lessons.length+'</strong><small>الدروس المحضّرة</small></div></div></div><div class="columns"><div>'+panel("اختصارات سريعة",'<div class="quick"><button data-add="lesson">▤ تحضير درس<small>خطّط لحصة جديدة</small></button><button data-page="attendance">◷ تسجيل الحضور<small>متابعة القسم اليوم</small></button><button data-add="activity">✎ إنشاء نشاط<small>تمرين أو وضعية</small></button><button data-add="resource">▧ إضافة مورد<small>تنظيم وثائقك</small></button></div>')+'</div><div>'+panel("ابدأ من هنا",emptybox("مساحتك جاهزة للعمل","أضف الأقسام والتلاميذ ثم ابدأ تسجيل أعمالك."))+'</div></div>'}
function classes(){let r=data.classes.map(x=>'<tr><td><b>'+safe(x.name)+'</b></td><td>'+safe(x.level)+'</td><td>'+data.students.filter(s=>s.classId===x.id).length+'</td><td>'+actions(x.id)+'</td></tr>').join("");return header("classes",button("إضافة قسم","class"))+panel("الأقسام المسجلة",data.classes.length?rows(["اسم القسم","المستوى","عدد التلاميذ","الإجراءات"],r):emptybox("لم تنشئ أي قسم بعد","أضف قسماً لتبدأ تنظيم قائمة التلاميذ."))}
function students(){let q=($("#studentSearch")||{}).value||"",list=data.students.filter(x=>(x.name+" "+(x.code||"")).toLowerCase().includes(q.toLowerCase()));let r=list.map(x=>'<tr><td><b>'+safe(x.name)+'</b></td><td>'+safe(x.code||"—")+'</td><td>'+safe((data.classes.find(c=>c.id===x.classId)||{}).name||"—")+'</td><td>'+safe(x.note||"—")+'</td><td>'+actions(x.id)+'</td></tr>').join("");return header("students",button("إضافة تلميذ","student"))+'<div class="toolbar"><input id="studentSearch" class="field" placeholder="ابحث بالاسم أو رقم التعريف..." value="'+safe(q)+'"></div>'+panel("قائمة التلاميذ",list.length?rows(["الاسم","رقم التعريف","القسم","ملاحظة","الإجراءات"],r):emptybox("لا توجد تلاميذ","أضف تلميذاً إلى قائمتك."))}
function attendance(){let d=$("#attdate")?$("#attdate").value:new Date().toISOString().slice(0,10);let r=data.students.map(s=>{let a=data.attendance.find(x=>x.studentId===s.id&&x.date===d);return '<tr><td>'+safe(s.name)+'</td><td><select class="field status" data-student="'+s.id+'" data-date="'+d+'"><option '+(!a||a.status==="حاضر"?"selected":"")+' value="حاضر">حاضر</option><option '+(a&&a.status==="غائب"?"selected":"")+' value="غائب">غائب</option><option '+(a&&a.status==="متأخر"?"selected":"")+' value="متأخر">متأخر</option><option '+(a&&a.status==="مبرر"?"selected":"")+' value="مبرر">مبرر</option></select></td></tr>'}).join("");return header("attendance")+'<div class="toolbar"><label>التاريخ</label><input class="field" type="date" id="attdate" value="'+d+'"></div>'+panel("سجل الحضور",data.students.length?rows(["التلميذ","الحالة"],r):emptybox("قائمة التلاميذ فارغة","أضف التلاميذ أولاً حتى تسجل حضورهم."))}
function cards(k){let a=data[k];return a.length?'<div class="cards">'+a.map(x=>'<article class="item"><span class="tag">'+(k==="lessons"?"تحضير":k==="activities"?"نشاط":"مورد")+'</span><h3>'+safe(x.title)+'</h3><p>'+safe(x.description||x.subject||x.category||"")+'</p>'+actions(x.id)+'</article>').join("")+'</div>':emptybox("لا توجد عناصر بعد","أضف أول عنصر إلى مساحتك.")}
function lessons(){return header("lessons",button("تحضير جديد","lesson"))+cards("lessons")}
function activities(){return header("activities",button("إنشاء نشاط","activity"))+cards("activities")}
function assessments(){let r=data.assessments.map(x=>'<tr><td>'+safe(x.student)+'</td><td>'+safe(x.skill)+'</td><td>'+safe(x.score)+'</td><td>'+actions(x.id)+'</td></tr>').join("");return header("assessments",button("إضافة نتيجة","assessment"))+panel("نتائج التقويم",r?rows(["التلميذ","المهارة","النتيجة","الإجراءات"],r):emptybox("لا توجد نتائج","أضف نتيجة تقويم لمتابعة التقدم."))}
function resources(){return header("resources",button("إضافة مورد","resource"))+cards("resources")}
function reports(){let n=data.attendance.length,p=data.attendance.filter(x=>x.status==="حاضر").length;return header("reports")+'<div class="stats"><div class="stat"><i>♙</i><div><strong>'+data.students.length+'</strong><small>التلاميذ</small></div></div><div class="stat"><i>◷</i><div><strong>'+n+'</strong><small>تسجيلات الحضور</small></div></div><div class="stat"><i>▤</i><div><strong>'+data.lessons.length+'</strong><small>التحضيرات</small></div></div><div class="stat"><i>◈</i><div><strong>'+data.assessments.length+'</strong><small>نتائج التقويم</small></div></div></div>'+panel("مؤشر الحضور",'<h2>'+(n?Math.round(p/n*100):0)+'%</h2><p>نسبة الحضور من إجمالي التسجيلات.</p><button class="btn quiet" data-export="all">تنزيل نسخة من البيانات</button>')}
function assistant(){return header("assistant")+panel("مساعد مِداد",emptybox("المساعد الذكي غير مربوط بعد","سيتم ربط خدمة الذكاء الاصطناعي من جهة الخادم بعد إعداد API آمن. لن ندّعي وجود خدمة غير مفعّلة."))}
function settings(){return header("settings")+panel("بيانات الأستاذ",'<div class="f"><label>اسم الأستاذ</label><input id="teacher" value="'+safe(data.teacher)+'"></div><br><button class="btn quiet" id="backup">تنزيل نسخة احتياطية</button> <button class="btn quiet" id="clear">مسح بيانات هذه النسخة</button>')}
function render(){let fn={home,classes,students,attendance,lessons,activities,assessments,resources,reports,assistant,settings}[page]||home;$("#view").innerHTML=fn();$("#crumb").textContent=titles[page][0];document.querySelectorAll("[data-page]").forEach(b=>b.classList.toggle("active",b.dataset.page===page))}
const schemas={
"class":{title:"إضافة قسم",fields:[["name","اسم القسم","text",1],["level","المستوى الدراسي","select",1,["الأولى ابتدائي","الثانية ابتدائي","الثالثة ابتدائي","الرابعة ابتدائي","الخامسة ابتدائي"]]]},
"student":{title:"إضافة تلميذ",fields:[["name","الاسم واللقب","text",1],["code","رقم التعريف","text"],["classId","القسم","select",0,data.classes.map(x=>[x.id,x.name])],["note","ملاحظة","text"]]},
"lesson":{title:"تحضير درس",fields:[["title","عنوان الدرس","text",1],["subject","المادة","text",1],["level","المستوى","text"],["field","الميدان / المقطع","text"],["competency","الكفاءة المستهدفة","textarea"],["objectives","الأهداف التعليمية","textarea"],["launch","وضعية الانطلاق","textarea"],["learning","بناء التعلمات","textarea"],["assessment","التقويم والمعالجة","textarea"]]},
"activity":{title:"إنشاء نشاط",fields:[["title","عنوان النشاط","text",1],["subject","المادة","text",1],["type","نوع النشاط","select",0,["فردي","جماعي","اختيار متعدد","صح أو خطأ","إكمال الفراغ","فهم واستيعاب"]],["description","تعليمات النشاط","textarea",1]]},
"assessment":{title:"تسجيل نتيجة",fields:[["student","اسم التلميذ","select",1,data.students.map(x=>[x.name,x.name])],["skill","المهارة","text",1],["score","النتيجة","text",1]]},
"resource":{title:"إضافة مورد",fields:[["title","اسم المورد","text",1],["category","التصنيف","select",0,["درس","تمرين","وثيقة","مرجع","رابط"]],["description","وصف أو رابط","textarea"]]}
};
function openModal(t,id){type=t;editing=id||null;let s=schemas[t],obj=null,key={class:"classes",student:"students",lesson:"lessons",activity:"activities",assessment:"assessments",resource:"resources"}[t];if(id)obj=data[key].find(x=>x.id===id);$("#mtitle").textContent=obj?"تعديل البيانات":s.title;$("#fields").innerHTML=s.fields.map(f=>{let n=f[0],label=f[1],kind=f[2],opts=f[4]||[],v=obj?obj[n]||"":"";let el=kind==="textarea"?'<textarea name="'+n+'">'+safe(v)+'</textarea>':kind==="select"?'<select name="'+n+'"><option value="">اختر...</option>'+opts.map(o=>Array.isArray(o)?'<option value="'+safe(o[0])+'" '+(v===o[0]?"selected":"")+'>'+safe(o[1])+'</option>':'<option '+(v===o?"selected":"")+'>'+safe(o)+'</option>').join("")+'</select>':'<input name="'+n+'" value="'+safe(v)+'" '+(f[3]?"required":"")+'>';return '<div class="f '+(kind==="textarea"?"full":"")+'"><label>'+label+'</label>'+el+'</div>'}).join("");$("#modalbg").classList.add("show")}
function close(){type=null;editing=null;$("#modalbg").classList.remove("show")}
$("#form").addEventListener("submit",e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target).entries()),key={class:"classes",student:"students",lesson:"lessons",activity:"activities",assessment:"assessments",resource:"resources"}[type];if(editing){Object.assign(data[key].find(x=>x.id===editing),d)}else data[key].push(Object.assign({id:Date.now().toString(),date:new Date().toISOString().slice(0,10)},d));save();close();render();notify("تم حفظ البيانات على هذا الجهاز.")});
document.addEventListener("click",e=>{let b=e.target.closest("[data-page]");if(b){page=b.dataset.page;$("#side").classList.remove("open");render();return}let a=e.target.closest("[data-add]");if(a){openModal(a.dataset.add);return}let ed=e.target.closest("[data-edit]");if(ed){let id=ed.dataset.edit;for(let pair of Object.entries({classes:"class",students:"student",lessons:"lesson",activities:"activity",assessments:"assessment",resources:"resource"})){if(data[pair[0]].some(x=>x.id===id)){openModal(pair[1],id);return}}}let del=e.target.closest("[data-del]");if(del&&confirm("هل تريد حذف هذا السجل؟")){for(let k of ["classes","students","lessons","activities","assessments","resources"])data[k]=data[k].filter(x=>x.id!==del.dataset.del);save();render();notify("تم الحذف.")}if(e.target.id==="backup"||e.target.closest("[data-export]")){let blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"}),u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download="midad-backup.json";a.click();URL.revokeObjectURL(u)}if(e.target.id==="clear"&&confirm("سيتم حذف بيانات هذه النسخة المحلية. متابعة؟")){data=Object.assign({},empty);save();render()}});
$("#view").addEventListener("change",e=>{if(e.target.classList.contains("status")){let d=e.target.dataset.date,s=e.target.dataset.student,x=data.attendance.find(a=>a.date===d&&a.studentId===s);if(x)x.status=e.target.value;else data.attendance.push({id:Date.now().toString(),date:d,studentId:s,status:e.target.value});save();notify("تم تحديث الحضور.")}if(e.target.id==="attdate")render()});
$("#view").addEventListener("input",e=>{if(e.target.id==="teacher"){data.teacher=e.target.value;save() }if(e.target.id==="studentSearch"){let v=e.target.value,pos=e.target.selectionStart;render();let el=$("#studentSearch");if(el){el.focus();el.setSelectionRange(pos,pos)}}});
$("#menu").onclick=()=>$("#side").classList.toggle("open");$("#theme").onclick=()=>{document.body.classList.toggle("dark");localStorage.setItem("midad_dark",document.body.classList.contains("dark"))};$("#profile").onclick=()=>{page="settings";render()};$("#cancel").onclick=close;if(localStorage.getItem("midad_dark")==="true")document.body.classList.add("dark");render();
})();
</script></body></html>
